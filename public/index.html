<!DOCTYPE html>

<meta property="og:title" content="AI Master — sunʼiy intellektni amalda oʻrganing">
<meta property="og:description" content="Topshiriqli qisqa darslar. Kuniga 15 daqiqa — va siz ishda SIdan foydalanasiz.">
<meta name="theme-color" content="#FAFAF8">
<link rel="alternate" hreflang="uz" href="/?lang=uz"><link rel="alternate" hreflang="ru" href="/?lang=ru"><link rel="alternate" hreflang="en" href="/?lang=en">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23FF6B1A'/%3E%3Cpath d='M32 42 L56 62 L32 82' fill='none' stroke='%2314161F' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M64 84 H86' stroke='%2314161F' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FAFAF8;--bg2:#F1F0EC;--card:#FFFFFF;--ink:#111318;--ink2:#3B3E47;--muted:#71717A;--line:#E7E5E0;
 --brand:#FF6B1A;--brand-ink:#B8490A;--brand-soft:#FFF1E8;
 --green:#15803D;--green-soft:#E7F6EC;--red:#C2410C;--red-soft:#FDECE3;--blue:#3347C9;--blue-soft:#EDF0FF;
 --r:20px;--sh-sm:0 1px 2px rgba(17,19,24,.04);--sh:0 1px 2px rgba(17,19,24,.04),0 10px 30px rgba(17,19,24,.06);--sh-lg:0 24px 64px rgba(17,19,24,.14);
 --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0D0F14;--bg2:#161920;--card:#15181F;--ink:#F2F1EE;--ink2:#C9C8C3;--muted:#8E8D88;--line:#262A33;
 --brand-ink:#FF9A5C;--brand-soft:#2B1D15;--green:#4ADE80;--green-soft:#11251A;--red:#FB8A5C;--red-soft:#2E1A12;--blue:#8F9DFF;--blue-soft:#1A1F3A;
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink2)}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;line-height:1.1;letter-spacing:-.025em;font-weight:800}
h1{font-size:clamp(38px,6vw,68px)}h2{font-size:clamp(28px,3.6vw,44px)}h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.ico{width:20px;height:20px;flex:none}.ico.s{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-family:Manrope,Inter,sans-serif;font-size:15px;background:var(--brand);color:#111318;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .15s var(--ease),box-shadow .2s,background .15s;line-height:1.2;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn:active{transform:translateY(0)}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.dark:hover{box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--bg2);filter:none;box-shadow:inset 0 0 0 1px var(--line)}
.btn.link{background:none;padding:0;color:var(--ink);font-weight:700}.btn.link:hover{color:var(--brand-ink);filter:none;box-shadow:none;transform:none}
.btn.sm{padding:9px 16px;font-size:14px;border-radius:10px}.btn.lg{padding:17px 28px;font-size:16.5px;border-radius:14px}.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn.shine::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite 1.5s}
@keyframes shine{0%,70%{left:-60%}100%{left:140%}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
section{padding:96px 0;position:relative}
@media(max-width:640px){section{padding:64px 0}}
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:44px;max-width:640px}
.head p{font-size:18px;color:var(--muted)}
/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.top.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;gap:8px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Manrope;font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{transition:transform .4s var(--ease)}.logo:hover svg{transform:rotate(-8deg) scale(1.05)}
.navlinks{display:flex;gap:4px;margin:0 auto}
.navlinks a{text-decoration:none;padding:8px 14px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:15px;transition:background .15s,color .15s}
.navlinks a:hover,.navlinks a.on{color:var(--ink);background:var(--bg2)}
.navright{display:flex;align-items:center;gap:8px;margin-left:auto}
.langs{display:flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;padding:5px 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.langs button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:10px;height:40px;width:40px;color:var(--ink)}
.iconbtn:hover{background:var(--bg2)}
.burger{display:none}
@media(max-width:900px){.navlinks{display:none}.burger{display:inline-flex}}
@media(max-width:520px){.hide-xs{display:none!important}}
.sheet{position:fixed;inset:72px 0 0 0;z-index:39;background:var(--bg);padding:12px 20px 24px;display:flex;flex-direction:column;gap:4px;animation:fade .2s}
.sheet a.big{display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-family:Manrope;font-weight:700;font-size:24px;padding:16px 0;border-bottom:1px solid var(--line)}
/* hero */
.hero{padding:72px 0 64px;overflow:hidden}
.hero .bgfx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 16s ease-in-out infinite}
.blob.b1{width:520px;height:520px;background:radial-gradient(circle,#FFB27A,transparent 65%);top:-160px;right:-120px}
.blob.b2{width:420px;height:420px;background:radial-gradient(circle,#B9C4FF,transparent 65%);bottom:-200px;left:-140px;animation-delay:-6s}
@media (prefers-color-scheme:dark){.blob{opacity:.22}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-40px,30px) scale(1.06)}66%{transform:translate(30px,-20px) scale(.96)}}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;position:relative}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:48px}.hero{padding:40px 0 56px}}
.hero h1 .hl{color:var(--brand);position:relative;display:inline-block}
.hero h1 .hl::after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.12em;background:currentColor;opacity:.22;border-radius:99px;transform:scaleX(0);transform-origin:left;animation:underline 1s var(--ease) .6s forwards}
@keyframes underline{to{transform:scaleX(1)}}
.hero .lead{font-size:20px;color:var(--ink2);max-width:480px;line-height:1.5}
.ticks{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14.5px;color:var(--muted)}
.ticks span{display:inline-flex;align-items:center;gap:8px}.ticks .ico{color:var(--green)}
.h-in>*{opacity:0;transform:translateY(18px);animation:up .8s var(--ease) forwards}
.h-in>*:nth-child(2){animation-delay:.1s}.h-in>*:nth-child(3){animation-delay:.2s}.h-in>*:nth-child(4){animation-delay:.3s}
@keyframes up{to{opacity:1;transform:none}}
.mockwrap{position:relative;opacity:0;animation:up 1s var(--ease) .35s forwards}
.mock{background:#111318;color:#F2F1EE;border-radius:24px;box-shadow:var(--sh-lg);padding:22px;display:flex;flex-direction:column;gap:14px;min-height:360px}
.mock .lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A9A8A3}
.mock .pr{background:#1E222B;border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:13.5px;min-height:84px;line-height:1.55}
.mock .pr .cur{display:inline-block;width:8px;height:15px;background:#FF9A5C;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mock .ans{font-family:'JetBrains Mono',monospace;font-size:13.5px;color:#C9C8C3;min-height:88px;line-height:1.6}
.mock .ans div{opacity:0;transform:translateX(-6px);transition:all .35s var(--ease)}.mock .ans div.on{opacity:1;transform:none}
.mock .ans .k{color:#8F9DFF}.mock .ans .v{color:#9FE3A9}
.mock .res{display:flex;align-items:center;justify-content:space-between;gap:10px;opacity:0;transform:scale(.96);transition:all .4s var(--ease)}
.mock .res.on{opacity:1;transform:none}
.mock .score{font-family:Manrope;font-weight:800;font-size:30px;color:#4ADE80}
.mock .pass{display:inline-flex;align-items:center;gap:8px;background:#4ADE80;color:#111318;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13.5px}
.chipf{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;animation:bob 6s ease-in-out infinite}
.chipf.c1{left:-28px;bottom:-22px}.chipf.c2{right:-16px;top:-20px;animation-delay:-3s}
.chipf .ico{color:var(--brand)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:560px){.chipf.c1{left:8px}.chipf.c2{right:8px}}
/* marquee */
.marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--card);padding:18px 0;overflow:hidden;position:relative}
.marq::before,.marq::after{content:"";position:absolute;top:0;bottom:0;width:80px;z-index:1;pointer-events:none}
.marq::before{left:0;background:linear-gradient(90deg,var(--card),transparent)}.marq::after{right:0;background:linear-gradient(-90deg,var(--card),transparent)}
.marq .tl{display:flex;gap:44px;width:max-content;animation:marq 38s linear infinite}
.marq:hover .tl{animation-play-state:paused}
.marq span{display:inline-flex;align-items:center;gap:10px;font-family:Manrope;font-weight:700;font-size:18px;color:var(--ink2);white-space:nowrap}
.marq span .ico{color:var(--brand)}
@keyframes marq{to{transform:translateX(-50%)}}
.marq .cap{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
/* tiles */
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);color:var(--ink);transition:transform .3s var(--ease),background .3s,color .3s}
.tile .ico{width:24px;height:24px}
.path{display:flex;flex-direction:column;gap:14px;text-decoration:none;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}
.path:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));box-shadow:var(--sh);transform:translateY(-4px)}
.path:hover .tile{background:var(--brand);color:#111318;transform:rotate(-6deg)}
.path p{color:var(--muted);font-size:15px}
.path .go{margin-top:auto;padding-top:8px;color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.path .go .ico{transition:transform .25s var(--ease)}.path:hover .go .ico{transform:translateX(4px)}
/* demo video */
.demo-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
@media(max-width:960px){.demo-grid{grid-template-columns:1fr;gap:32px}}
.vid{position:relative;border-radius:22px;overflow:hidden;background:#111318;box-shadow:var(--sh-lg);aspect-ratio:16/9}
.vid video{width:100%;height:100%;display:block;object-fit:cover}
.vid .ov{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(17,19,24,.05),rgba(17,19,24,.45));transition:opacity .3s}
.vid.playing .ov{opacity:0;pointer-events:none}
.vplay{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#111318;border:0;border-radius:999px;padding:10px 22px 10px 10px;font-weight:700;font-family:Manrope;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.vplay:hover{transform:scale(1.04)}
.vplay .pb{width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;position:relative}
.vplay .pb::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--brand);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.vbar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(17,19,24,.65);backdrop-filter:blur(8px);border-radius:12px;padding:6px 10px;color:#fff;opacity:0;transition:opacity .3s}
.vid.playing:hover .vbar,.vid.paused .vbar{opacity:1}
.vbar button{background:transparent;border:0;color:#fff;display:grid;place-items:center;width:32px;height:32px;border-radius:8px}
.vbar button:hover{background:rgba(255,255,255,.14)}
.vbar .pg{flex:1;height:4px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;cursor:pointer}
.vbar .pg i{display:block;height:100%;width:0;background:var(--brand)}
.feat{display:flex;gap:14px;align-items:flex-start}
/* steps */
.steps{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.steps::before{content:"";position:absolute;top:24px;left:48px;right:48px;height:2px;background:var(--line)}
.steps::after{content:"";position:absolute;top:24px;left:48px;right:48px;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform 1.6s var(--ease) .3s}
.steps.in::after{transform:scaleX(1)}
@media(max-width:760px){.steps{grid-template-columns:1fr;gap:28px}.steps::before,.steps::after{display:none}}
.step{display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.step .tile{background:var(--card);border:1px solid var(--line)}
.step p{color:var(--muted)}
/* benefits */
.ben{display:flex;gap:16px;align-items:flex-start;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);transition:transform .25s var(--ease),box-shadow .25s}
.ben:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.ben p{color:var(--muted);font-size:15px;margin-top:4px}
/* stats band */
.band{background:#111318;color:#F2F1EE;border-radius:28px;padding:48px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-100px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,26,.45),transparent 70%);animation:float 14s ease-in-out infinite}
.band .v{font-family:Manrope;font-weight:800;font-size:clamp(34px,4vw,46px);letter-spacing:-.02em}
.band .l{color:#A9A8A3}
/* course card */
.ccard{display:flex;flex-direction:column;text-decoration:none;padding:0;overflow:hidden;transition:box-shadow .25s,transform .25s var(--ease),border-color .2s}
.ccard:hover{box-shadow:var(--sh);transform:translateY(-4px);border-color:color-mix(in srgb,var(--ink) 15%,var(--line))}
.ccard .body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.ccard .desc{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .arr{transition:transform .25s var(--ease)}.ccard:hover .arr{transform:translateX(4px)}
.ccover{position:relative;height:150px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:18px}
.ccover::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 85% 20%,#000,transparent 70%);mask-image:radial-gradient(circle at 85% 20%,#000,transparent 70%);transition:transform 6s linear}
.ccard:hover .ccover::before{transform:translate(22px,22px)}
.ccover .gl{position:relative;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .4s var(--ease)}
.ccard:hover .ccover .gl{transform:translateY(-4px) rotate(-6deg)}
.ccover .gl .ico{width:28px;height:28px}
.ccover .lb{position:relative;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.ccover .nw{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;background:#fff;color:#111318;padding:4px 10px;border-radius:999px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.price{font-family:Manrope;font-weight:800;font-size:20px;letter-spacing:-.02em}
.price.free{color:var(--green)}
/* pricing */
.plan{display:flex;flex-direction:column;gap:18px;position:relative;transition:transform .25s var(--ease),box-shadow .25s}
.plan:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.plan.best{border-color:var(--ink);box-shadow:var(--sh)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink2)}
.plan li{display:flex;gap:10px;align-items:flex-start}.plan li .ico{color:var(--green);margin-top:3px}
.plan .badge{position:absolute;top:-12px;left:28px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.pnum{transition:opacity .2s}
/* faq */
.split{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:40px}}
.faq details{border-bottom:1px solid var(--line);padding:22px 0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:17px;font-family:Manrope}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .25s var(--ease);color:var(--muted)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted);animation:fade .3s}
.success{text-align:center;padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:up .5s var(--ease)}
.success .ok{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
/* course page */
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.course-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
@media(max-width:960px){.course-grid{grid-template-columns:1fr;gap:32px}}
.buybox{position:sticky;top:96px;padding:0;overflow:hidden}
@media(max-width:960px){.buybox{position:static}}
.mod{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.mod+.mod{margin-top:10px}
.mod summary{padding:18px 20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.mod summary::-webkit-details-marker{display:none}
.mod summary .ico{transition:transform .25s var(--ease);color:var(--muted)}
.mod[open] summary .ico{transform:rotate(180deg)}
.mod .ls a{display:flex;align-items:center;gap:12px;padding:13px 20px;text-decoration:none;border-top:1px solid var(--line);font-size:15px;transition:background .15s}
.mod .ls a:hover{background:var(--bg)}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.num.done{background:var(--green);border-color:var(--green);color:#fff}
.num .ico{width:13px;height:13px}
.outc{display:flex;gap:12px;align-items:flex-start}.outc .ico{color:var(--green);margin-top:3px}
/* lesson */
.lbar{position:sticky;top:0;z-index:41;background:var(--card);border-bottom:1px solid var(--line)}
.lbar .in{display:flex;align-items:center;gap:10px;height:62px;padding:0 14px}
.lbar .ttl{font-weight:700;font-family:Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s var(--ease)}
.lesson-layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media(max-width:900px){.lesson-layout{grid-template-columns:1fr}.toc{display:none}.toc.open{display:block;position:fixed;inset:62px 0 0 0;z-index:45;animation:fade .2s}}
.toc{border-right:1px solid var(--line);padding:20px 14px;background:var(--bg);overflow:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
.toc a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink2);line-height:1.35}
.toc a:hover{background:var(--bg2)}
.toc a.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.toc .mh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px}
.toc .cp{padding:6px 10px 2px}
.lesson-main{padding:32px 20px 120px}
.reader{max-width:720px;margin:0 auto;font-size:17px}
.reader .block{margin:28px 0;animation:up .6s var(--ease) both}
.reader .block:nth-child(2){animation-delay:.06s}.reader .block:nth-child(3){animation-delay:.12s}.reader .block:nth-child(4){animation-delay:.18s}.reader .block:nth-child(5){animation-delay:.24s}
.reader .txt p{margin:0 0 14px}
.reader .txt h2{font-size:clamp(28px,3.4vw,36px);margin:0 0 18px}
.reader .txt h3{margin:26px 0 10px;font-size:22px}
.reader .txt ul{margin:0 0 14px;padding-left:22px}.reader .txt li{margin:6px 0}
.reader table{border-collapse:collapse;width:100%;font-size:15px}
.reader th,.reader td{border:1px solid var(--line);padding:9px 12px;text-align:left}.reader th{background:var(--bg2)}
.reader code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--bg2);padding:1px 6px;border-radius:6px}
.callout{border-radius:16px;padding:16px 18px;display:flex;gap:12px;border:1px solid var(--line);background:var(--card)}
.callout .h{font-weight:700;margin-bottom:2px}.callout .ci{flex:none;margin-top:2px}
.callout.tip .ci{color:var(--blue)}.callout.important .ci{color:var(--brand-ink)}.callout.error .ci{color:var(--red)}.callout.example .ci{color:var(--green)}
.code{background:#111318;color:#F2F1EE;border-radius:16px;overflow:hidden}
.code .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 16px;background:#1B1E26;font-size:13px;color:#A9A8A3}
.code .hd button{background:transparent;border:0;color:#D8D7D2;font-size:13px;padding:5px 10px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.code .hd button:hover{background:#2A2E38}
.code pre{margin:0;padding:16px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;white-space:pre-wrap}
.k{color:#FF9A5C}.s{color:#9FE3A9}.c{color:#8A90A3}.fn{color:#8F9DFF}
.formula{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;font-family:'Times New Roman',serif;font-size:26px}
.formula .cap{font-family:Inter;font-size:13.5px;color:var(--muted);margin-top:8px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.quiz .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:10px;color:var(--ink);transition:border-color .15s,transform .15s var(--ease)}
.quiz .opt:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line));transform:translateX(3px)}
.quiz .opt .l{width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.quiz .opt.ok{border-color:var(--green);background:var(--green-soft)}.quiz .opt.ok .l{background:var(--green);color:#fff;animation:pop .4s var(--ease)}
.quiz .opt.bad{border-color:var(--red);background:var(--red-soft);animation:shake .35s}.quiz .opt.bad .l{background:var(--red);color:#fff}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.quiz .why{font-size:14.5px;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--bg2);animation:up .3s var(--ease)}
.sbx{background:#111318;color:#F2F1EE;border-radius:22px;padding:24px}
.sbx textarea{background:#1E222B;color:#F2F1EE;border:1px solid #333845;font-family:'JetBrains Mono',monospace;font-size:14px;min-height:120px}
.sbx .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A9A8A3}
.sbx .out{background:#1E222B;border-radius:12px;padding:12px 14px;min-height:60px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13.5px;max-height:300px;overflow:auto}
.sbx .doc{background:#1A1D25;border-radius:12px;padding:12px 14px;font-size:14px;color:#D7D5CF}
.sbx .btn.ghost{color:#F2F1EE;box-shadow:inset 0 0 0 1px #3A3F4D}.sbx .btn.ghost:hover{background:#1E222B}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0;animation:up .35s var(--ease) both}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:#111318}
.chk .ic.y{background:#4ADE80}.chk .ic.n{background:#FF9A5C}.chk .ic .ico{width:12px;height:12px}
.fab{position:fixed;right:22px;bottom:22px;z-index:44;box-shadow:var(--sh-lg);animation:up .6s var(--ease) .5s both}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease);box-shadow:var(--sh-lg)}
.drawer.open{transform:none}
.drawer .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:16px;font-size:14.5px;max-width:90%;white-space:pre-wrap;animation:up .3s var(--ease)}
.msg.u{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:6px}
.msg.a{background:var(--bg2);align-self:flex-start;border-bottom-left-radius:6px}
.drawer form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;color:var(--ink2);transition:all .15s}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lock{text-align:center;padding:48px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:var(--card);border-radius:24px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:32px;box-shadow:var(--sh-lg);position:relative;animation:modalin .35s var(--ease)}
@keyframes modalin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal .x{position:absolute;right:14px;top:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:12px;z-index:100;font-size:14.5px;font-weight:500;box-shadow:var(--sh-lg);max-width:90vw;animation:up .3s var(--ease)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
footer{border-top:1px solid var(--line);padding:48px 0}
footer a{text-decoration:none;color:var(--muted);font-size:14.5px}footer a:hover{color:var(--ink)}
.skel{background:linear-gradient(90deg,var(--bg2),var(--line),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv,.h-in>*,.mockwrap{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<header class="top" id="hdr"><div class="wrap nav" id="nav"></div></header>
<main id="app"><div class="wrap" style="padding:96px 20px"><div class="skel" style="height:64px;max-width:520px"></div><div class="skel" style="height:22px;max-width:380px;margin-top:20px"></div></div></main>
<footer id="footer"><div class="wrap" id="foot"></div></footer>
<div id="layer"></div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
