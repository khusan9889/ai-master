<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Master — обучение ИИ на практике</title>
<meta name="description" content="Короткие интерактивные уроки по искусственному интеллекту: практика в песочнице, ИИ-наставник и сертификат. На узбекском, русском и английском.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23FF6B1A'/%3E%3Cpath d='M32 42 L56 62 L32 82' fill='none' stroke='%2314161F' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M64 84 H86' stroke='%2314161F' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FAF9F6;--bg2:#F2F0EA;--card:#FFFFFF;--ink:#14161F;--ink2:#3A3D48;--muted:#6E6C66;--line:#E9E6DE;
 --brand:#FF6B1A;--brand-ink:#B24A0B;--brand-soft:#FFF0E5;--indigo:#3B4FD8;--indigo-soft:#ECEFFF;
 --green:#16834A;--green-soft:#E3F5EA;--red:#C2410C;--red-soft:#FDE8DD;
 --dark:#14161F;--dark2:#1E212C;--dark3:#2A2E3B;--onDark:#F4F2EE;
 --r:20px;--r-sm:12px;
 --sh-sm:0 1px 2px rgba(20,22,31,.05);
 --sh:0 1px 2px rgba(20,22,31,.04),0 8px 28px rgba(20,22,31,.07);
 --sh-lg:0 24px 60px rgba(20,22,31,.16);
}
[data-theme="dark"]{
 --bg:#0E1016;--bg2:#161922;--card:#1A1D27;--ink:#F1EFEA;--ink2:#CFCCC4;--muted:#9B988F;--line:#2A2D39;
 --brand-ink:#FF9A5C;--brand-soft:#33221A;--indigo:#8C9BFF;--indigo-soft:#1D2240;
 --green:#5ACB86;--green-soft:#15291E;--red:#FF8A5B;--red-soft:#361D14;
 --dark:#1E212C;--dark2:#262A36;--dark3:#30344250;
 --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--brand) 30%,transparent);border-color:var(--brand)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--ink2)}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0;line-height:1.12;letter-spacing:-.02em}
h1{font-size:clamp(34px,5.2vw,60px);font-weight:800}
h2{font-size:clamp(28px,3.4vw,42px);font-weight:800}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
.muted{color:var(--muted)}
.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--sh-sm)}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-family:Manrope,Inter,sans-serif;font-size:15.5px;background:var(--brand);color:#14161F;text-decoration:none;white-space:nowrap;transition:transform .12s,filter .15s,background .15s;line-height:1.2}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--bg2);filter:none}
.btn.soft{background:var(--bg2);color:var(--ink)}
.btn.link{background:none;padding:0;color:var(--brand-ink);font-weight:700}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn.lg{padding:16px 26px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.o{background:var(--brand-soft);color:var(--brand-ink)}.pill.g{background:var(--green-soft);color:var(--green)}.pill.b{background:var(--indigo-soft);color:var(--indigo)}.pill.r{background:var(--red-soft);color:var(--red)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink)}
section{padding:72px 0}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;max-width:680px}
.sec-head p{font-size:18px;color:var(--muted)}
/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
header.top.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;gap:10px;height:70px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Manrope;font-weight:800;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--brand)}
.navlinks{display:flex;gap:2px;margin-left:24px}
.navlinks a{text-decoration:none;padding:9px 14px;border-radius:11px;color:var(--ink2);font-weight:600;font-size:15px}
.navlinks a:hover{background:var(--bg2);color:var(--ink)}
.navlinks a.on{color:var(--ink);background:var(--bg2)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0;border-radius:11px;height:40px;min-width:40px;padding:0 10px;color:var(--ink2);font-weight:700;font-size:13.5px}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.langsel{appearance:none;width:auto;border:0;background:transparent;padding:0 10px;height:40px;font-weight:700;font-size:13.5px;color:var(--ink2);border-radius:11px;cursor:pointer}
.langsel:hover{background:var(--bg2)}
.burger{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#14161F;display:grid;place-items:center;font-weight:800;font-family:Manrope;font-size:15px;flex:none}
.me-link{display:flex;align-items:center;gap:10px;text-decoration:none;padding:3px 12px 3px 3px;border-radius:999px;font-weight:700;font-size:14.5px}
.me-link:hover{background:var(--bg2)}
@media(max-width:900px){.navlinks,.hide-md{display:none!important}.burger{display:inline-flex}}
@media(max-width:520px){.hide-sm{display:none!important}.nav{gap:4px}.logo{font-size:18px}}
.sheet{position:fixed;inset:70px 0 0 0;z-index:39;background:var(--bg);padding:20px;display:flex;flex-direction:column;gap:6px;overflow:auto;animation:fade .15s}
.sheet a.big{display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-family:Manrope;font-weight:700;font-size:22px;padding:14px 4px;border-bottom:1px solid var(--line)}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* hero */
.hero{padding:64px 0 56px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:40px}}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero .lead{font-size:19px;color:var(--ink2);max-width:540px}
.checks{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14.5px;color:var(--ink2)}
.checks span{display:inline-flex;align-items:center;gap:7px}
.checks .ico{color:var(--green)}
.mock{position:relative}
.mock .win{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-lg);padding:22px;display:flex;flex-direction:column;gap:14px}
.mock .float{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.mock .f1{left:-26px;bottom:38px}.mock .f2{right:-14px;top:-18px}
@media(max-width:560px){.mock .f1{left:-6px;bottom:-22px}.mock .f2{right:-4px}}
.qopt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);font-size:14.5px}
.qopt.ok{border-color:var(--green);background:var(--green-soft)}
.qopt .l{width:24px;height:24px;border-radius:7px;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.qopt.ok .l{background:var(--green);color:#fff}
/* path cards */
.path{display:flex;flex-direction:column;gap:12px;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.path:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.path .pi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.path .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14.5px;color:var(--brand-ink)}
/* steps */
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:960px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{position:relative;padding-top:4px}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:Manrope;font-weight:800;margin-bottom:14px}
.step p{color:var(--muted);font-size:15px;margin-top:6px}
/* course card */
.ccard{display:flex;flex-direction:column;gap:12px;text-decoration:none;padding:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.ccard:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.ccard .body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.ccover{height:132px;display:flex;align-items:flex-start;justify-content:space-between;padding:16px;color:#fff;position:relative;overflow:hidden}
.ccover::after{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.ccover::before{content:"";position:absolute;right:60px;bottom:-90px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.ccover .tg{background:rgba(0,0,0,.22);backdrop-filter:blur(4px);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;position:relative;z-index:1}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.price{font-family:Manrope;font-weight:800;font-size:20px;letter-spacing:-.01em}
.price.free{color:var(--green)}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{position:relative;flex:1;min-width:220px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:42px}
/* band */
.band{background:var(--dark);color:var(--onDark);border-radius:28px;padding:44px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,26,.35),transparent 70%)}
.band .muted{color:#B5B2AA}
.stat .v{font-family:Manrope;font-weight:800;font-size:36px;letter-spacing:-.02em}
/* pricing */
.plan{display:flex;flex-direction:column;gap:14px;position:relative}
.plan.best{border:2px solid var(--brand);box-shadow:var(--sh)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px;color:var(--ink2)}
.plan li{display:flex;gap:9px;align-items:flex-start}
.plan li .ico{color:var(--green);margin-top:2px}
.plan .badge{position:absolute;top:-13px;left:24px}
.seg{display:inline-flex;background:var(--bg2);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
/* faq */
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-size:17px;font-family:Manrope}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--muted);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted)}
/* lead form */
.leadbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh)}
.success{text-align:center;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.success .ok{width:60px;height:60px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
/* course page */
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.course-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:36px;align-items:start}
@media(max-width:960px){.course-grid{grid-template-columns:1fr}}
.buybox{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
@media(max-width:960px){.buybox{position:static}}
.mod{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.mod+.mod{margin-top:10px}
.mod summary{padding:16px 18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.mod summary::-webkit-details-marker{display:none}
.mod .ls a{display:flex;align-items:center;gap:12px;padding:12px 18px;text-decoration:none;border-top:1px solid var(--line);font-size:15px}
.mod .ls a:hover{background:var(--bg)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.dot.done{background:var(--green);border-color:var(--green)}
.outc{display:flex;gap:12px;align-items:flex-start}
.outc .ic{width:28px;height:28px;border-radius:9px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
/* lesson */
.lbar{position:sticky;top:0;z-index:41;background:var(--card);border-bottom:1px solid var(--line)}
.lbar .in{display:flex;align-items:center;gap:12px;height:62px;padding:0 16px}
.lbar .ttl{font-weight:700;font-family:Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.progress{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.progress.g>i{background:var(--green)}
.lesson-layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media(max-width:900px){.lesson-layout{grid-template-columns:1fr}.toc{display:none}.toc.open{display:block;position:fixed;inset:62px 0 0 0;z-index:45}}
.toc{border-right:1px solid var(--line);padding:20px 14px;background:var(--bg);overflow:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
.toc a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:9px 10px;border-radius:11px;font-size:14.5px;color:var(--ink2)}
.toc a:hover{background:var(--bg2)}
.toc a.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.toc .mh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px}
.lesson-main{padding:28px 20px 120px}
.reader{max-width:720px;margin:0 auto}
.reader .block{margin:26px 0}
.reader .txt p{margin:0 0 14px}
.reader .txt h2{font-size:clamp(28px,3.4vw,36px);margin:0 0 16px}
.reader .txt h3{margin:24px 0 10px;font-size:22px}
.reader .txt ul{margin:0 0 14px;padding-left:22px}.reader .txt li{margin:6px 0}
.reader table{border-collapse:collapse;width:100%;font-size:15px}
.reader th,.reader td{border:1px solid var(--line);padding:9px 12px;text-align:left}
.reader th{background:var(--bg2)}
.reader code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--bg2);padding:1px 6px;border-radius:6px}
.callout{border-radius:16px;padding:16px 18px;display:flex;gap:12px}
.callout .h{font-weight:700;margin-bottom:3px}
.callout.tip{background:var(--indigo-soft)}.callout.tip .ci{color:var(--indigo)}
.callout.important{background:var(--brand-soft)}.callout.important .ci{color:var(--brand-ink)}
.callout.error{background:var(--red-soft)}.callout.error .ci{color:var(--red)}
.callout.example{background:var(--green-soft)}.callout.example .ci{color:var(--green)}
.callout .ci{flex:none;margin-top:2px}
.code{background:#14161F;color:#F4F2EE;border-radius:16px;overflow:hidden}
.code .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 16px;background:#1E212C;font-size:13px;color:#B9B6AE}
.code .hd button{background:transparent;border:0;color:#D8D5CD;font-size:13px;padding:5px 10px;border-radius:8px}
.code .hd button:hover{background:#2A2E3B}
.code pre{margin:0;padding:16px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6}
.k{color:#FF9A5C}.s{color:#9FE3A9}.c{color:#8A90A3}.fn{color:#8C9BFF}
.formula{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;font-family:'Times New Roman',serif;font-size:26px}
.formula .cap{font-family:Inter;font-size:13.5px;color:var(--muted);margin-top:8px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.quiz .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:10px;color:var(--ink)}
.quiz .opt:hover{border-color:color-mix(in srgb,var(--brand) 60%,var(--line))}
.quiz .opt .l{width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.quiz .opt.ok{border-color:var(--green);background:var(--green-soft)}.quiz .opt.ok .l{background:var(--green);color:#fff}
.quiz .opt.bad{border-color:var(--red);background:var(--red-soft)}.quiz .opt.bad .l{background:var(--red);color:#fff}
.quiz .why{font-size:14.5px;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--bg2)}
.sbx{background:#14161F;color:#F4F2EE;border-radius:22px;padding:22px}

function phoneInput(id,val){return `<input id="${id}" name="phone" type="tel" inputmode="tel" autocomplete="tel" data-phone value="${esc(val||'+998 ')}" placeholder="+998 90 123 45 67" required>`}
function fmtPhone(v){let d=v.replace(/\D/g,'');if(!d.startsWith('998'))d='998'+d.replace(/^998?/,'');d=d.slice(0,12);const p=[d.slice(0,3),d.slice(3,5),d.slice(5,8),d.slice(8,10),d.slice(10,12)].filter(Boolean);return '+'+p.join(' ')}

function renderBlock(b,i,lid){

 if(b.t==='formula')return `<div class="block"><div class="formula">${b.html}<div class="cap">${esc(b.cap)}</div></div></div>`;
 if(b.t==='code')return `<div class="block"><div class="code"><div class="hd"><span>${esc(b.lang)}</span><button data-act="copy" data-arg="${i}">${ic('copy')} Копировать</button></div><pre>${hl(b.code,b.lang)}</pre></div></div>`;
 if(b.t==='quiz'){const st=S.quiz[b.id];return `<div class="block quiz" id="${esc(b.id)}"><span class="kicker" style="color:var(--indigo)">${ic('target')} Проверьте себя</span><h3 style="margin:8px 0 2px;font-size:20px">${esc(b.q)}</h3>
  ${b.opts.map((o,k)=>{const picked=st&&st.pick===k;return `<button class="opt ${picked?(o.ok?'ok':'bad'):''}" data-act="quiz" data-arg="${lid}|${i}|${k}"><span class="l">${picked?(o.ok?'✓':'✕'):String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></button>${picked?`<div class="why"><b>${o.ok?'Верно. ':'Не совсем. '}</b>${esc(o.why)}</div>`:''}`}).join('')}</div>`}
 if(b.t==='sandbox')return sandboxHTML(b);

function hl(code,lang){let h=esc(code);if(lang==='Python'){h=h.replace(/(#.*)$/gm,'<span class="c">$1</span>').replace(/\b(from|import|print|def|return|for|in)\b/g,'<span class="k">$1</span>').replace(/\b(LinearRegression|fit|predict)\b/g,'<span class="fn">$1</span>')}else{h=h.replace(/(&quot;[a-z]+&quot;)/g,'<span class="s">$1</span>')}return h}

function fakeModel(prompt,contract){
 const p=prompt.toLowerCase();
 const amount=Number((contract.match(/(?:составляет|услуг —)\s*([\d\s]+)\s*\(/)||[])[1]?.replace(/\s/g,'')||0);
 const dm=contract.match(/(\d{1,2})\s+(декабря|марта)\s+(\d{4})/);const mon={декабря:'12',марта:'03'};
 const iso=dm?`${dm[3]}-${mon[dm[2]]}-${dm[1].padStart(2,'0')}`:'';const human=dm?`${dm[1]} ${dm[2]} ${dm[3]}`:'';
 const pen=(contract.match(/(\d+,\d+)%/)||[])[1]||'';
 if(!/json/.test(p))return `В договоре указана сумма ${amount.toLocaleString('ru-RU')} сум, срок — ${human} года, пеня — ${pen}% за каждый день просрочки.`;
 const keys=/amount|deadline|penalty/.test(p)?['amount','deadline','penalty']:['сумма','срок','штраф'];
 const numPen=/числ|number|0\.1|процент/.test(p);const isoD=/гггг|yyyy|iso|\d{4}-\d{2}/.test(p);const onlyJson=/только|only|без поясн|без текста/.test(p);
 const obj={};obj[keys[0]]=/числ|number|сум/.test(p)?amount:amount.toLocaleString('ru-RU')+' сум';obj[keys[1]]=isoD?iso:human;obj[keys[2]]=numPen?Number(pen.replace(',','.')):pen+'% в день';
 const js=JSON.stringify(obj,null,2);return onlyJson?js:'Вот данные из договора:\n'+js+'\nЕсли нужно, могу добавить другие поля.'}
async function runModel(prompt,contract){const real=await askAI(`${prompt}\n\n---\nТекст договора:\n${contract}`,{cache:true});if(real!=null)return {text:real,real:true};await new Promise(r=>setTimeout(r,600));return {text:fakeModel(prompt,contract),real:false}}
function extractJSON(s){const m=s.match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}
function checkOne(text,exp){const o=extractJSON(text);const r={json:!!o,amount:false,deadline:false,penalty:false};if(!o)return r;
 r.amount=typeof o.amount==='number'&&o.amount===exp.amount;r.deadline=o.deadline===exp.deadline;
 const pv=o.penalty;r.penalty=typeof pv==='number'&&(Math.abs(pv-exp.penalty)<1e-9||Math.abs(pv-exp.penalty/100)<1e-9);return r}

 if(s.includes('узбек'))return 'Til modeli — matnni davom ettiradigan dastur. U keyingi so‘zni ehtimollik bo‘yicha tanlaydi.';

function coItem(arg){if(arg.startsWith('course-')){const c=course(arg.slice(7));return c&&c.price>0?{title:'Курс «'+c.title+'»',amount:c.price,type:'course',c}:null}const p=PLANS.find(x=>x.id===arg);return p?{title:`Подписка на ${p.months} мес.`,amount:p.price,type:'sub',months:p.months}:null}
function calc(it){let d=0;if(co.promo)d=co.promo.type==='pct'?Math.round(it.amount*co.promo.val/100):co.promo.val;d=Math.min(d,it.amount);return {disc:d,total:it.amount-d}}
function pCheckout(arg){const it=coItem(arg);if(!it)return pNotFound();
 if(!U()){try{sessionStorage.setItem('after','checkout-'+arg)}catch(e){}return `<section style="padding-top:56px"><div class="wrap" style="max-width:480px"><div class="card col" style="text-align:center;align-items:center;gap:14px;padding:32px"><div class="lock" style="padding:0"><div class="lk">${ic('user')}</div></div><h2 style="font-size:26px">Войдите, чтобы оформить покупку</h2><p class="muted">Доступ к курсу привяжется к вашему номеру телефона. Это займёт 30 секунд.</p><a class="btn lg block" href="#login">Войти по номеру телефона</a></div></div></section>`}
 const {disc,total}=calc(it);
 return `<section style="padding-top:36px"><div class="wrap" style="max-width:980px">
 <nav class="crumbs" style="margin-bottom:16px"><a href="${it.c?'#course-'+it.c.id:'#pricing'}">${ic('back')} Назад</a></nav>
 <div class="course-grid" style="grid-template-columns:minmax(0,1fr) 360px">
 <div class="col" style="gap:20px"><h1 style="font-size:clamp(30px,4vw,40px)">Оформление заказа</h1>
  <div class="card col"><h3>1. Способ оплаты</h3><div class="grid g2" style="gap:10px">${['Click','Payme'].map(m=>`<button class="choice ${co.method===m?'on':''}" data-act="coMethod" data-arg="${m}"><div class="col" style="gap:2px"><b>${m}</b><span class="small muted" style="font-weight:400">Uzcard, Humo, кошелёк ${m}</span></div></button>`).join('')}</div></div>
  <div class="card col"><h3>2. Промокод <span class="muted small" style="font-weight:400">— если есть</span></h3><form class="row" data-submit="promo" style="flex-wrap:nowrap"><input id="promoIn" placeholder="Введите промокод" value="${esc(co.promo?.code||'')}"><button class="btn ghost">Применить</button></form></div>
  ${SETTINGS.paymentsDemo?`<div class="demo-note">${ic('info')}<span>Оплата сейчас работает в демо-режиме: деньги не списываются, доступ открывается сразу после подтверждения.</span></div>`:''}
 </div>
 <aside class="buybox"><div class="card col" style="gap:14px;box-shadow:var(--sh)"><h3>Ваш заказ</h3>
  <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><span>${esc(it.title)}</span><b style="white-space:nowrap">${fmt(it.amount)}</b></div>
  ${disc?`<div class="row between"><span class="muted">Промокод ${esc(co.promo.code)}</span><span style="color:var(--green);font-weight:700">−${fmt(disc)}</span></div>`:''}
  <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:0"><div class="row between"><b>Итого</b><span class="price" style="font-size:26px">${fmt(total)}</span></div>
  <button class="btn lg block" data-act="createOrder" data-arg="${arg}">Оплатить через ${co.method}</button>
  <p class="tiny muted">Нажимая кнопку, вы принимаете <a href="#legal-offer">оферту</a>.${it.type==='sub'?' Подписка продлевается автоматически, отменить можно в кабинете.':''}</p></div></aside>
 </div></div></section>`}
function pPay(oid){const o=ORDERS.find(x=>x.id===oid);if(!o){if(S.token&&!pPay.loading){pPay.loading=true;loadOrders().then(()=>{pPay.loading=false;render()})}return `<div class="wrap" style="padding:80px 20px"><div class="skel" style="height:200px;max-width:520px;margin:0 auto"></div></div>`}
 return `<section style="padding-top:56px"><div class="wrap" style="max-width:520px"><div class="card col" style="gap:18px;padding:32px;box-shadow:var(--sh)">
 ${o.status==='paid'?`<div class="success" style="padding:0"><div class="ok">${ic('check','ico',2.5).replace('class="ico"','class="ico" style="width:30px;height:30px"')}</div><h2 style="font-size:28px">Оплата прошла!</h2><p class="muted">${esc(o.title)} — доступ уже открыт.</p>
   <a class="btn lg block" href="${o.type==='course'?'#course-'+o.ref:'#catalog'}">${o.type==='course'?'Перейти к курсу':'Выбрать курс'} ${ic('arrow')}</a><a class="btn ghost block" href="#me-billing">История платежей</a></div>`
 :o.status==='cancelled'?`<h2 style="font-size:26px">Оплата отменена</h2><p class="muted">Заказ ${esc(o.id)} не оплачен. Можно попробовать снова.</p><a class="btn lg block" href="#checkout-${o.key}">Вернуться к оформлению</a>`
 :`<div class="row between"><span class="small muted">Заказ ${esc(o.id)}</span>${statusPill(o.status)}</div><div><span class="muted">${esc(o.title)}</span><div class="price" style="font-size:36px">${fmt(o.amount)}</div></div>
   <div class="demo-note">${ic('info')}<span>Демо-оплата. В рабочей версии здесь будет переход на защищённую страницу ${esc(o.method)}, где вводятся данные карты.</span></div>
   <button class="btn lg block" data-act="payOk" data-arg="${o.id}">Подтвердить оплату</button><button class="btn ghost block" data-act="payCancel" data-arg="${o.id}">Отменить</button>`}
 </div></div></section>`}

/* ---- business & misc ---- */
function pBusiness(){return `<section class="hero" style="padding-bottom:40px"><div class="wrap hero-grid" style="align-items:start">
 <div class="col" style="gap:22px"><span class="kicker">${ic('users')} AI Master для компаний</span><h1 style="font-size:clamp(34px,4.6vw,54px)">Научим команду работать с ИИ — с отчётом по каждому сотруднику</h1>
  <p class="lead">Корпоративный трек «ИИ-грамотность», задания на задачах вашей отрасли и кабинет для HR: назначайте курсы с дедлайнами и смотрите прогресс.</p>
  <div class="col" style="gap:14px">${[['Пакет мест','Лицензии на нужное число сотрудников, оплата по счёту с НДС'],['Назначение курсов','Группы, отделы, дедлайны, приглашение по ссылке или списком'],['Отчёты для HR','Кто начал, кто завершил, результаты тестов, выгрузка в Excel']].map(x=>`<div class="outc"><span class="ic">${ic('check')}</span><div><b>${x[0]}</b><p class="muted small">${x[1]}</p></div></div>`).join('')}</div>
 </div>
 <div class="leadbox" id="leadBiz"><div class="col" style="gap:6px;margin-bottom:20px"><h3 style="font-size:24px">Получите предложение</h3><p class="muted">Ответим в течение рабочего дня и подготовим программу под ваши задачи.</p></div>${leadForm({type:'business',fields:['company','size','message'],cta:'Получить предложение',msgPh:'Какие задачи хотите решить с помощью ИИ?'})}</div>
 </div></section>
 <section style="padding-top:24px"><div class="wrap"><div class="sec-head"><h2>Как мы работаем</h2></div><div class="steps">${[['Заявка','Обсуждаем цели, отделы и сроки обучения.'],['Программа','Подбираем курсы и отраслевые задания.'],['Обучение','Сотрудники учатся в удобное время, 15 минут в день.'],['Отчёт','HR видит прогресс и результаты каждого.']].map((s,i)=>`<div class="step"><div class="n">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>`}
let vRes=null;
function pVerify(no){if(no&&(!vRes||vRes.no!==no)){vRes={no,loading:true};api('/api/certs/'+encodeURIComponent(no)).then(r=>{vRes={no,ok:true,c:r.cert};render()}).catch(()=>{vRes={no,ok:false};render()})}
 return `<section style="padding-top:44px"><div class="wrap narrow col" style="gap:20px"><h1 style="font-size:clamp(32px,4.4vw,46px)">Проверка сертификата</h1><p class="muted" style="font-size:18px">Введите номер сертификата — он указан внизу документа.</p>
 <form class="row" data-submit="verify" style="flex-wrap:nowrap"><input id="vNo" placeholder="AIM-2026-000123" value="${esc(vRes?.no||'')}"><button class="btn">Проверить</button></form>
 ${vRes&&!vRes.loading?vRes.ok?`<div class="callout example"><span class="ci">${ic('check')}</span><div><div class="h">Сертификат действителен</div>${esc(vRes.c.name)} · «${esc(vRes.c.course)}» · ${vRes.c.hours} ч · выдан ${esc(vRes.c.date)}</div></div>`:`<div class="callout error"><span class="ci">${ic('warn')}</span><div><div class="h">Сертификат не найден</div>Проверьте номер. Пример: AIM-2026-000123.</div></div>`:''}</div></section>`}
function pBlog(){return `<section style="padding-top:44px"><div class="wrap col" style="gap:24px"><h1 style="font-size:clamp(32px,4.4vw,46px)">Статьи</h1><div class="grid g3">${[['Промпты','10 приёмов, которые сразу улучшат ваши промпты'],['Бизнес','Как посчитать окупаемость ИИ-ассистента для отдела продаж'],['Основы','Что такое токены и почему они стоят денег']].map(a=>`<div class="card col"><span class="pill b" style="width:fit-content">${a[0]}</span><h3>${a[1]}</h3><p class="small muted">Скоро</p></div>`).join('')}</div></div></section>`}
function pLegal(kind){const T={'legal-offer':'Публичная оферта','legal-privacy':'Политика конфиденциальности','legal-refund':'Правила возврата','contacts':'Контакты и реквизиты'};
 return `<section style="padding-top:44px"><div class="wrap narrow col" style="gap:18px"><h1 style="font-size:clamp(30px,4vw,42px)">${T[kind]}</h1>${kind==='contacts'?`<div class="card col"><p><b>Телефон:</b> ${esc(SETTINGS.contactPhone||'—')}</p><p><b>Telegram:</b> ${esc(SETTINGS.contactTelegram||'—')}</p><p><b>Адрес:</b> г. Ташкент</p><p class="muted small">ООО «AI Master» · ИНН и банковские реквизиты — будут добавлены.</p></div><button class="btn" style="width:fit-content" data-act="lead" data-arg="consult">${ic('phone')} Заказать звонок</button>`:'<p class="muted">Текст документа готовится юристом и будет опубликован до запуска приёма платежей.</p>'}</div></section>`}
function pNotFound(){return `<section><div class="wrap empty"><h2>Страница не найдена</h2><p>Возможно, ссылка устарела.</p><a class="btn" href="#home">На главную</a></div></section>`}

/* ================== ROUTER ================== */
function render(){
 const r=location.hash.slice(1)||'home';let html;
 const isLesson=r.startsWith('lesson-');
 if(r==='home')html=pHome();else if(r==='catalog')html=pCatalog();else if(r.startsWith('course-'))html=pCourse(r.slice(7));
 else if(isLesson)html=pLesson(r.slice(7));else if(r==='match')html=pMatch();
 else if(r==='login')html=U()?(setTimeout(()=>go('me')),''):pLogin();else if(r==='onboarding')html=pOnboarding();
 else if(r==='me')html=pMe();else if(r==='me-certs')html=pCerts();else if(r==='me-notes')html=pNotes();else if(r==='me-billing')html=pBilling();else if(r==='me-profile')html=pProfile();
 else if(r.startsWith('checkout-'))html=pCheckout(r.slice(9));else if(r.startsWith('pay-'))html=pPay(r.slice(4));
 else if(r==='business')html=pBusiness();else if(r==='pricing')html=pricingSection(false);else if(r==='verify')html=pVerify();else if(r.startsWith('verify-'))html=pVerify(r.slice(7));
 else if(r==='blog')html=pBlog();else if(r.startsWith('legal-')||r==='contacts')html=pLegal(r);else html=pNotFound();
 document.getElementById('hdr').style.display=isLesson?'none':'';
 document.getElementById('footer').style.display=isLesson?'none':'';
 if(!isLesson)renderNav();
 document.getElementById('app').innerHTML=html;
 if(!isLesson)renderFoot();
 document.querySelectorAll('[data-stack]').forEach(g=>{if(matchMedia('(max-width:900px)').matches)g.style.gridTemplateColumns='1fr'});
 if(r==='login'&&auth.step==='code')startTimer();
}
let lastRoute='';
const TITLES={home:'AI Master — обучение ИИ на практике',catalog:'Курсы — AI Master',pricing:'Цены — AI Master',business:'Обучение для компаний — AI Master',match:'Подбор курса — AI Master',login:'Вход — AI Master'};
function setTitle(r){const c=r.startsWith('course-')&&course(r.slice(7));const l=r.startsWith('lesson-')&&findLesson(r.slice(7));document.title=c?c.title+' — AI Master':l?l.l.t+' — AI Master':TITLES[r]||'AI Master'}
window.addEventListener('hashchange',async()=>{const r=location.hash.slice(1)||'home';sheetOpen=false;
 const changed=r!==lastRoute;lastRoute=r;setTitle(r);
 if(r==='me-certs'||r==='me')await loadCerts();if(r==='me-billing')await loadOrders();
 render();if(changed)window.scrollTo({top:0,left:0,behavior:'instant'})});
addEventListener('scroll',()=>document.getElementById('hdr').classList.toggle('scrolled',scrollY>8),{passive:true});

/* ================== EVENTS ================== */
let tmrI=null;
function startTimer(){clearInterval(tmrI);let s=120;const tick=()=>{const el=document.getElementById('tmr');if(!el){clearInterval(tmrI);return}if(s<=0){clearInterval(tmrI);el.innerHTML='<button type="button" class="btn link" data-act="resend">Отправить код ещё раз</button>';return}el.textContent=`Новый код через ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;s--};tick();tmrI=setInterval(tick,1000)}
function lessonBlocks(lid){return lessonData(lid)?.blocks||[]}
document.addEventListener('click',async e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,arg=a.dataset.arg;
 if(a.tagName==='A'&&!['logout','pickAud','closeModal'].includes(act))e.preventDefault();
 switch(act){
  case 'closeModal':if(a.classList.contains('modal-bg')&&e.target!==a)break;closeModal();break;
  case 'theme':S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();renderNav();break;
  case 'burger':sheetOpen=!sheetOpen;renderNav();break;
  case 'lead':e.preventDefault();openLead(arg,a.dataset.course?{courseId:a.dataset.course,sub:'Курс «'+(course(a.dataset.course)?.title||'')+'». Расскажем о программе, формате и оплате.'}:{});break;
  case 'pickAud':catF={q:'',aud:arg,free:false,sort:'pop'};break;
  case 'catAud':catF.aud=arg;catF.free=false;refreshCatalog();break;
  case 'catFree':catF.free=!catF.free;if(catF.free)catF.aud='';refreshCatalog();break;
  case 'catReset':catF={q:'',aud:'',free:false,sort:'pop'};render();break;
  case 'planPick':priceMode=arg;render();break;
  case 'font':S.font=Math.max(14,Math.min(22,(S.font||17)+Number(arg)));save();document.getElementById('reader').style.fontSize=S.font+'px';break;
  case 'toggleMentor':document.getElementById('mentor')?.classList.toggle('open');setTimeout(()=>document.getElementById('mentorIn')?.focus(),250);break;
  case 'toggleToc':document.getElementById('toc')?.classList.toggle('open');break;
  case 'retryLesson':delete LCACHE[arg];render();break;
  case 'copy':{const b=lessonBlocks(location.hash.slice(8))[arg];try{await navigator.clipboard.writeText(b.code);toast('Скопировано')}catch(_){toast('Не удалось скопировать')}break}
  case 'copyText':try{await navigator.clipboard.writeText(arg);toast('Скопировано')}catch(_){toast(arg)}break;
  case 'print':window.print();break;
  case 'rate':toast(arg==='up'?'Спасибо за оценку!':'Спасибо! Учтём при доработке урока');break;
  case 'quiz':{const [lid,bi,k]=arg.split('|');const b=lessonBlocks(lid)[bi];if(!b)break;const ok=b.opts[k].ok;const prev=S.quiz[b.id];S.quiz[b.id]={pick:Number(k),ok:ok||!!(prev&&prev.ok)};if(ok&&!(prev&&prev.ok))addXP(10);save();const y=scrollY;render();scrollTo(0,y);break}
  case 'completeLesson':{S.done[arg]=true;addXP(50);const c=findLesson(arg).c;const ls=allLessons(c);const i=ls.findIndex(x=>x.id===arg);
    if(courseProgress(c)===100){
     if(!U()){toast('Курс пройден! Войдите, чтобы получить сертификат');try{sessionStorage.setItem('after','me-certs')}catch(_){}setTimeout(()=>go('login'),900);break}
     try{await api('/api/me/state',{method:'PUT',body:{state:Object.fromEntries(SYNC_KEYS.map(k=>[k,S[k]]))}});await api('/api/me/certs',{method:'POST',body:{courseId:c.id}});await loadCerts();toast('Курс завершён! Сертификат выдан 🎓');setTimeout(()=>go('me-certs'),900)}catch(er){toast(er.message)}}
    else{toast('Урок пройден · +50 XP');if(i<ls.length-1)setTimeout(()=>go('lesson-'+ls[i+1].id),600);else render()}break}
  case 'sbRun':case 'sbCheck':{const p=document.getElementById('sbPrompt').value.trim();if(p.length<10){toast('Напишите промпт подлиннее');break}
    if(!useRun())break;const out=document.getElementById('sbOut');out.textContent='Модель думает…';a.disabled=true;
    const st=S.quiz[arg]||{};st.prompt=p;
    const r1=await runModel(p,CONTRACT_A);out.textContent=r1.text;st.out=r1.text;
    if(act==='sbCheck'){document.getElementById('sbRes').innerHTML='<div class="tiny" style="color:#B9B6AE">Проверяю на втором, скрытом договоре…</div>';const r2=await runModel(p,CONTRACT_B);
     const A=checkOne(r1.text,EXPECT_A),B=checkOne(r2.text,EXPECT_B);let score=0;const checks=[];
     const both=(k,pts,okT,badT)=>{const ok=A[k]&&B[k];if(ok)score+=pts;checks.push({ok,t:ok?okT:badT})};
     both('json',3,'Ответ — валидный JSON на обоих договорах','JSON не найден. Попросите вернуть ТОЛЬКО JSON без пояснений');
     both('amount',2,'Сумма — число и совпадает','amount должен быть числом в сумах, без пробелов и слова «сум»');
     both('deadline',2,'Срок в формате ГГГГ-ММ-ДД и совпадает','deadline должен быть строкой вида 2026-12-31');
     both('penalty',3,'Пеня — число и совпадает','penalty должен быть числом (например, 0.1), а не текстом');
     if(!(B.json&&B.amount&&B.deadline&&B.penalty)&&(A.json&&A.amount&&A.deadline&&A.penalty))checks.push({ok:false,t:'На скрытом договоре промпт ошибся — возможно, он подогнан под пример'});
     const was=S.quiz[arg]&&S.quiz[arg].score>=7;st.score=score;st.checks=checks;if(score>=7&&!was)addXP(30);
     S.quiz[arg]=st;save();const y=scrollY;render();scrollTo(0,y)}
    else{S.quiz[arg]=st;save();a.disabled=false}break}
  case 'sbHint':{const p=document.getElementById('sbPrompt').value.trim();openMentor();mentorAsk(p?`Подскажи, как улучшить мой промпт (без готового ответа): «${p}»`:'С чего начать это задание?');break}
  case 'mentorQuick':mentorAsk(arg+(selText?`: «${selText}»`:' — по теме этого урока'));selText='';break;
  case 'mPick':mA.push(Number(arg));render();scrollTo({top:0,behavior:'instant'});break;
  case 'mBack':mA.pop();render();break;
  case 'mReset':mA=[];render();break;
  case 'authBack':auth.step='phone';render();break;
  case 'resend':try{await api('/api/auth/request',{method:'POST',body:{phone:auth.phone}});toast('Код отправлен повторно');startTimer()}catch(er){toast(er.message)}break;
  case 'ob':{const [k,v]=arg.split('|');ob[k]=v;ob.name=document.getElementById('obName')?.value??ob.name;render();break}
  case 'obDone':case 'obSkip':{const name=document.getElementById('obName')?.value.trim();if(act==='obDone'&&name&&name!==U().name){try{S.user=(await api('/api/me',{method:'PUT',body:{name}})).user}catch(_){}}
    const g=ob.goal||'';const rec=g.startsWith('Стать')?'ml-zero':g.startsWith('Автомат')?'ai-business':ob.level==='Новичок'?'ai-basics':'prompt-eng';S.onboarding={goal:ob.goal,level:ob.level,min:ob.min,rec};save();const back=sessionStorage.getItem('after')||'me';try{sessionStorage.removeItem('after')}catch(_){}go(back);break}
  case 'logout':api('/api/auth/logout',{method:'POST'}).catch(()=>{});S.token=null;S.user=null;CERTS=[];ORDERS=[];Object.keys(LCACHE).forEach(k=>delete LCACHE[k]);save();toast('Вы вышли из аккаунта');break;
  case 'autoOff':case 'autoOn':try{S.user=(await api('/api/me/sub/auto',{method:'POST',body:{auto:act==='autoOn'}})).user;save();render();toast(act==='autoOn'?'Автопродление включено':'Автопродление отменено')}catch(er){toast(er.message)}break;
  case 'coMethod':co.method=arg;render();break;
  case 'createOrder':{a.disabled=true;try{const r=await api('/api/orders',{method:'POST',body:{item:arg,method:co.method,promo:co.promo?.code}});ORDERS.unshift(r.order);co.promo=null;go('pay-'+r.order.id)}catch(er){toast(er.message);a.disabled=false}break}
  case 'payOk':{a.disabled=true;a.textContent='Подтверждаем…';try{const r=await api(`/api/orders/${arg}/pay-demo`,{method:'POST'});S.user=r.user;save();ORDERS=ORDERS.map(o=>o.id===arg?r.order:o);Object.keys(LCACHE).forEach(k=>delete LCACHE[k]);render()}catch(er){toast(er.message);a.disabled=false}break}
  case 'payCancel':{try{const r=await api(`/api/orders/${arg}/cancel`,{method:'POST'});ORDERS=ORDERS.map(o=>o.id===arg?r.order:o);render()}catch(er){toast(er.message)}break}
 }
});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.change;if(!k)return;
 if(k==='lang'){S.lang=el.value;document.documentElement.lang=S.lang;save();render()}
 if(k==='catSort'){catF.sort=el.value;refreshCatalog()}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-phone]')){const v=fmtPhone(el.value);if(v!==el.value)el.value=v}
 const k=el.dataset.input;if(k==='catq'){catF.q=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}if(k==='noteq'){noteQ=el.value;document.getElementById('notesList').innerHTML=notesList()}});
document.addEventListener('focusin',e=>{if(e.target.matches('[data-phone]')&&!e.target.value)e.target.value='+998 '});
document.addEventListener('submit',async e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();
 const btn=f.querySelector('button:not([type=button])');
 if(k==='lead'){const fd=Object.fromEntries(new FormData(f).entries());fd.page=location.hash.slice(1)||'home';
  if(fd.phone.replace(/\D/g,'').length<12){toast('Введите номер полностью: +998 XX XXX XX XX');return}
  btn.disabled=true;btn.textContent='Отправляем…';
  try{await api('/api/leads',{method:'POST',body:fd});const box=f.parentElement;box.innerHTML=leadSuccess()}catch(er){toast(er.message);btn.disabled=false;btn.innerHTML='Попробовать ещё раз'}return}
 if(k==='phone'){const ph=document.getElementById('phone').value.trim();if(ph.replace(/\D/g,'').length!==12){toast('Введите номер полностью: +998 XX XXX XX XX');return}if(!document.getElementById('agree').checked){toast('Нужно принять оферту');return}
  auth.busy=true;btn.disabled=true;try{await api('/api/auth/request',{method:'POST',body:{phone:ph}});auth={step:'code',phone:ph,busy:false};render();document.getElementById('code')?.focus()}catch(er){auth.busy=false;btn.disabled=false;toast(er.message)}return}
 if(k==='code'){const c=document.getElementById('code').value.trim();if(c.length<4){toast('Введите код из SMS');return}btn.disabled=true;
  try{const r=await api('/api/auth/verify',{method:'POST',body:{phone:auth.phone,code:c}});auth={step:'phone',phone:'',busy:false};await afterLogin(r);loadCerts()}catch(er){btn.disabled=false;toast(er.message)}return}
 if(k==='mentor'){const i=document.getElementById('mentorIn');const q=i.value.trim();if(!q)return;i.value='';mentorAsk(q);return}
 if(k==='promo'){const code=document.getElementById('promoIn').value.trim();if(!code)return;try{co.promo=(await api('/api/promo',{method:'POST',body:{code}})).promo;toast('Промокод применён');render()}catch(er){toast(er.message)}return}
 if(k==='profile'){try{S.user=(await api('/api/me',{method:'PUT',body:{name:document.getElementById('pfName').value.trim()}})).user;save();toast('Сохранено');render()}catch(er){toast(er.message)}return}
 if(k==='verify'){const no=document.getElementById('vNo').value.trim().toUpperCase();if(no)go('verify-'+no);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('mentor')?.classList.remove('open');if(sheetOpen){sheetOpen=false;renderNav()}}});

/* ---- выделение текста в уроке ---- */
let selText='';
document.addEventListener('mouseup',e=>{setTimeout(()=>{if(e.target.closest('.selbar'))return;document.querySelector('.selbar')?.remove();
 const s=window.getSelection();const txt=s?String(s).trim():'';if(!txt||txt.length<3)return;const an=s.anchorNode&&s.anchorNode.parentElement;if(!an||!an.closest('[data-sel]'))return;
 selText=txt.slice(0,400);const rect=s.getRangeAt(0).getBoundingClientRect();const bar=document.createElement('div');bar.className='selbar';
 bar.style.left=Math.max(8,rect.left+scrollX)+'px';bar.style.top=(rect.top+scrollY-46)+'px';
 bar.innerHTML=`<button data-sa="simple">Объясни проще</button><button data-sa="ex">Пример</button><button data-sa="note">Заметка</button>`;document.body.appendChild(bar)},10)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-sa]');if(!b)return;const k=b.dataset.sa;document.querySelector('.selbar')?.remove();
 if(k==='note'){const lid=location.hash.slice(8);const f=findLesson(lid);S.notes.unshift({text:selText,lid,lesson:f?f.l.t:'',date:new Date().toLocaleDateString('ru-RU')});save();toast('Заметка сохранена — Кабинет → Заметки');return}
 openMentor();mentorAsk({simple:'Объясни проще',ex:'Дай пример'}[k]+`: «${selText}»`)});

/* ================== BOOT ================== */
(async function boot(){
 try{const r=await api('/api/catalog');COURSES=r.courses;PLANS=r.plans;SETTINGS=r.settings}
 catch(e){document.getElementById('app').innerHTML=`<div class="wrap empty" style="padding:100px 20px"><h2>Сайт временно недоступен</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Обновить страницу</button></div>`;return}
 if(S.token){try{const r=await api('/api/me');S.user=r.user;mergeState(r.user.state);save();await loadCerts()}catch(e){}}
 lastRoute=location.hash.slice(1)||'home';setTitle(lastRoute);
 if(lastRoute==='me-billing')await loadOrders();
 render();
})();
</script>
</body>
</html>
