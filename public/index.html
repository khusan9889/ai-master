<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Master — обучение ИИ на практике</title>
<meta name="description" content="Короткие интерактивные уроки по искусственному интеллекту с практикой. 15 минут в день.">
<meta property="og:title" content="AI Master — обучение ИИ на практике">
<meta property="og:description" content="Короткие уроки с заданиями. 15 минут в день — и вы используете ИИ в работе.">
<meta name="theme-color" content="#FAFAF8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='%23FF6B1A'/%3E%3Cpath d='M32 42 L56 62 L32 82' fill='none' stroke='%2314161F' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M64 84 H86' stroke='%2314161F' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FAFAF8;--bg2:#F1F0EC;--card:#FFFFFF;--ink:#111318;--ink2:#3B3E47;--muted:#71717A;--line:#E7E5E0;
 --brand:#FF6B1A;--brand-ink:#B8490A;--brand-soft:#FFF1E8;
 --green:#15803D;--green-soft:#E7F6EC;--red:#C2410C;--red-soft:#FDECE3;--blue:#3347C9;--blue-soft:#EDF0FF;
 --r:20px;--sh-sm:0 1px 2px rgba(17,19,24,.04);--sh:0 1px 2px rgba(17,19,24,.04),0 10px 30px rgba(17,19,24,.06);--sh-lg:0 24px 64px rgba(17,19,24,.14);
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0D0F14;--bg2:#161920;--card:#15181F;--ink:#F2F1EE;--ink2:#C9C8C3;--muted:#8E8D88;--line:#262A33;
 --brand-ink:#FF9A5C;--brand-soft:#2B1D15;--green:#4ADE80;--green-soft:#11251A;--red:#FB8A5C;--red-soft:#2E1A12;--blue:#8F9DFF;--blue-soft:#1A1F3A;
 --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink2)}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;line-height:1.1;letter-spacing:-.025em;font-weight:800}
h1{font-size:clamp(38px,6vw,68px)}h2{font-size:clamp(28px,3.6vw,44px)}h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.ico{width:20px;height:20px;flex:none}
.ico.s{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-family:Manrope,Inter,sans-serif;font-size:15px;background:var(--brand);color:#111318;text-decoration:none;white-space:nowrap;transition:filter .15s,transform .1s,background .15s;line-height:1.2}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--bg2);filter:none}
.btn.link{background:none;padding:0;color:var(--ink);font-weight:700}
.btn.link:hover{color:var(--brand-ink);filter:none}
.btn.sm{padding:9px 16px;font-size:14px;border-radius:10px}
.btn.lg{padding:17px 28px;font-size:16.5px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
section{padding:96px 0}
@media(max-width:640px){section{padding:64px 0}}
.head{display:flex;flex-direction:column;gap:12px;margin-bottom:44px;max-width:640px}
.head p{font-size:18px;color:var(--muted)}
/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
header.top.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;gap:8px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Manrope;font-weight:800;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
.navlinks{display:flex;gap:4px;margin:0 auto}
.navlinks a{text-decoration:none;padding:8px 14px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:15px}
.navlinks a:hover,.navlinks a.on{color:var(--ink);background:var(--bg2)}
.navright{display:flex;align-items:center;gap:8px;margin-left:auto}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:10px;height:40px;width:40px;color:var(--ink)}
.iconbtn:hover{background:var(--bg2)}
.burger{display:none}
@media(max-width:860px){.navlinks{display:none}.burger{display:inline-flex}}
@media(max-width:420px){.hide-xs{display:none!important}}
.sheet{position:fixed;inset:72px 0 0 0;z-index:39;background:var(--bg);padding:12px 20px 24px;display:flex;flex-direction:column;gap:4px}
.sheet a.big{display:flex;align-items:center;justify-content:space-between;text-decoration:none;font-family:Manrope;font-weight:700;font-size:24px;padding:16px 0;border-bottom:1px solid var(--line)}
/* hero */
.hero{padding:72px 0 88px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:48px}.hero{padding:40px 0 64px}}
.hero h1 span{color:var(--brand)}
.hero .lead{font-size:20px;color:var(--ink2);max-width:480px;line-height:1.5}
.ticks{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14.5px;color:var(--muted)}
.ticks span{display:inline-flex;align-items:center;gap:8px}
.ticks .ico{color:var(--green)}
.mock{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-lg);padding:24px;display:flex;flex-direction:column;gap:14px}
.mock .bar{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}.mock .bar i{display:block;height:100%;width:60%;background:var(--brand);border-radius:99px}
.qopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);font-size:14.5px}
.qopt.ok{border-color:var(--green);background:var(--green-soft)}
.qopt .l{width:24px;height:24px;border-radius:7px;background:var(--bg2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.qopt.ok .l{background:var(--green);color:#fff}
/* tiles */
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--bg2);color:var(--ink)}
.tile .ico{width:24px;height:24px}
.path{display:flex;flex-direction:column;gap:14px;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.path:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line));box-shadow:var(--sh);transform:translateY(-2px)}
.path p{color:var(--muted);font-size:15px}
.path .go{margin-top:auto;padding-top:8px;color:var(--ink);display:inline-flex}
.path:hover .go{color:var(--brand-ink)}
.step{display:flex;flex-direction:column;gap:12px}
.step p{color:var(--muted)}
/* course card */
.ccard{display:flex;flex-direction:column;text-decoration:none;padding:0;overflow:hidden;transition:box-shadow .15s,transform .15s,border-color .15s}
.ccard:hover{box-shadow:var(--sh);transform:translateY(-2px);border-color:color-mix(in srgb,var(--ink) 15%,var(--line))}
.ccard .body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.ccard .desc{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccover{position:relative;height:150px;overflow:hidden;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:18px}
.ccover::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 85% 20%,#000,transparent 70%);mask-image:radial-gradient(circle at 85% 20%,#000,transparent 70%)}
.ccover .gl{position:relative;width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);display:grid;place-items:center}
.ccover .gl .ico{width:28px;height:28px}
.ccover .lb{position:relative;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.ccover .nw{position:absolute;top:16px;right:16px;font-size:12px;font-weight:700;background:#fff;color:#111318;padding:4px 10px;border-radius:999px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.price{font-family:Manrope;font-weight:800;font-size:20px;letter-spacing:-.02em}
.price.free{color:var(--green)}
/* pricing */
.plan{display:flex;flex-direction:column;gap:18px;position:relative}
.plan.best{border-color:var(--ink);box-shadow:var(--sh)}
.plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink2)}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li .ico{color:var(--green);margin-top:3px}
.plan .badge{position:absolute;top:-12px;left:28px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
/* faq */
.faq details{border-bottom:1px solid var(--line);padding:22px 0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:17px;font-family:Manrope}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .2s;color:var(--muted)}
.faq details[open] summary .ico{transform:rotate(45deg)}
.faq details p{margin-top:10px;color:var(--muted)}
.split{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:64px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:40px}}
.success{text-align:center;padding:24px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.success .ok{width:56px;height:56px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
/* course page */
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}
.course-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
@media(max-width:960px){.course-grid{grid-template-columns:1fr;gap:32px}}
.buybox{position:sticky;top:96px;padding:0;overflow:hidden}
@media(max-width:960px){.buybox{position:static}}
.mod{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.mod+.mod{margin-top:10px}
.mod summary{padding:18px 20px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.mod summary::-webkit-details-marker{display:none}
.mod summary .ico{transition:transform .2s;color:var(--muted)}
.mod[open] summary .ico{transform:rotate(180deg)}
.mod .ls a{display:flex;align-items:center;gap:12px;padding:13px 20px;text-decoration:none;border-top:1px solid var(--line);font-size:15px}
.mod .ls a:hover{background:var(--bg)}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.dot.done{background:var(--green);border-color:var(--green)}
.dot .ico{width:13px;height:13px}
.outc{display:flex;gap:12px;align-items:flex-start}
.outc .ico{color:var(--green);margin-top:3px}
/* lesson */
.lbar{position:sticky;top:0;z-index:41;background:var(--card);border-bottom:1px solid var(--line)}
.lbar .in{display:flex;align-items:center;gap:10px;height:62px;padding:0 14px}
.lbar .ttl{font-weight:700;font-family:Manrope;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s}
.lesson-layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 62px)}
@media(max-width:900px){.lesson-layout{grid-template-columns:1fr}.toc{display:none}.toc.open{display:block;position:fixed;inset:62px 0 0 0;z-index:45}}
.toc{border-right:1px solid var(--line);padding:20px 14px;background:var(--bg);overflow:auto;position:sticky;top:62px;height:calc(100vh - 62px)}
.toc a{display:flex;gap:10px;align-items:center;text-decoration:none;padding:9px 10px;border-radius:10px;font-size:14.5px;color:var(--ink2)}
.toc a:hover{background:var(--bg2)}
.toc a.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.toc .mh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 10px 6px}
.lesson-main{padding:32px 20px 120px}
.reader{max-width:720px;margin:0 auto;font-size:17px}
.reader .block{margin:28px 0}
.reader .txt p{margin:0 0 14px}
.reader .txt h2{font-size:clamp(28px,3.4vw,36px);margin:0 0 18px}
.reader .txt h3{margin:26px 0 10px;font-size:22px}
.reader .txt ul{margin:0 0 14px;padding-left:22px}.reader .txt li{margin:6px 0}
.reader table{border-collapse:collapse;width:100%;font-size:15px}
.reader th,.reader td{border:1px solid var(--line);padding:9px 12px;text-align:left}.reader th{background:var(--bg2)}
.reader code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--bg2);padding:1px 6px;border-radius:6px}
.callout{border-radius:16px;padding:16px 18px;display:flex;gap:12px;border:1px solid var(--line);background:var(--card)}
.callout .h{font-weight:700;margin-bottom:2px}
.callout .ci{flex:none;margin-top:2px}
.callout.tip .ci{color:var(--blue)}.callout.important .ci{color:var(--brand-ink)}.callout.error .ci{color:var(--red)}.callout.example .ci{color:var(--green)}
.code{background:#111318;color:#F2F1EE;border-radius:16px;overflow:hidden}
.code .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 8px 16px;background:#1B1E26;font-size:13px;color:#A9A8A3}
.code .hd button{background:transparent;border:0;color:#D8D7D2;font-size:13px;padding:5px 10px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
.code .hd button:hover{background:#2A2E38}
.code pre{margin:0;padding:16px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6}
.k{color:#FF9A5C}.s{color:#9FE3A9}.c{color:#8A90A3}.fn{color:#8F9DFF}
.formula{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;font-family:'Times New Roman',serif;font-size:26px}
.formula .cap{font-family:Inter;font-size:13.5px;color:var(--muted);margin-top:8px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.quiz .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:10px;color:var(--ink)}
.quiz .opt:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.quiz .opt .l{width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.quiz .opt.ok{border-color:var(--green);background:var(--green-soft)}.quiz .opt.ok .l{background:var(--green);color:#fff}
.quiz .opt.bad{border-color:var(--red);background:var(--red-soft)}.quiz .opt.bad .l{background:var(--red);color:#fff}
.quiz .why{font-size:14.5px;margin-top:8px;padding:11px 14px;border-radius:12px;background:var(--bg2)}
.sbx{background:#111318;color:#F2F1EE;border-radius:22px;padding:24px}
.sbx textarea{background:#1E222B;color:#F2F1EE;border:1px solid #333845;font-family:'JetBrains Mono',monospace;font-size:14px;min-height:120px}
.sbx .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#A9A8A3}
.sbx .out{background:#1E222B;border-radius:12px;padding:12px 14px;min-height:60px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13.5px;max-height:300px;overflow:auto}
.sbx .doc{background:#1A1D25;border-radius:12px;padding:12px 14px;font-size:14px;color:#D7D5CF}
.sbx .btn.ghost{color:#F2F1EE;box-shadow:inset 0 0 0 1px #3A3F4D}.sbx .btn.ghost:hover{background:#1E222B}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:#111318}
.chk .ic.y{background:#4ADE80}.chk .ic.n{background:#FF9A5C}
.chk .ic .ico{width:12px;height:12px}
.fab{position:fixed;right:22px;bottom:22px;z-index:44;box-shadow:var(--sh-lg)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;box-shadow:var(--sh-lg)}
.drawer.open{transform:none}
.drawer .hd{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:16px;font-size:14.5px;max-width:90%;white-space:pre-wrap}
.msg.u{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:6px}
.msg.a{background:var(--bg2);align-self:flex-start;border-bottom-left-radius:6px}
.drawer form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;color:var(--ink2)}
.chip:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lock{text-align:center;padding:48px 28px;display:flex;flex-direction:column;align-items:center;gap:14px}
/* modal / toast */

let LP={lesson:null,chat:[]};const LCACHE={};
async function loadLesson(lid){
 try{const r=await fetch('/api/lessons/'+encodeURIComponent(lid));const j=await r.json().catch(()=>({}));LCACHE[lid]=r.status===402?{locked:true}:r.ok?{data:j.lesson}:{error:j.error||'Ошибка'}}
 catch(e){LCACHE[lid]={error:'Нет связи с сервером'}}
 if(LCACHE[lid].data!==undefined)T.ev('lesson',lid,{a:'start'});
 if(location.hash.slice(1)==='lesson-'+lid)render()}
function genericLesson(l,c){return {min:10,blocks:[{t:'text',html:`<h2>${esc(l.t)}</h2><p>Материал урока готовится и скоро появится.</p>`},{t:'callout',kind:'tip',h:'Совет',html:'Полностью готовый курс для знакомства — «Промпт-инжиниринг на практике».'}]}}
function lessonData(lid){const f=findLesson(lid);const x=LCACHE[lid];if(!x||x.data===undefined)return null;return x.data&&x.data.blocks?x.data:genericLesson(f.l,f.c)}
function pLesson(lid){const f=findLesson(lid);if(!f)return pNotFound();const {c,l}=f;
 const ls=allLessons(c);const idx=ls.findIndex(x=>x.id===lid);
 if(LP.lesson!==lid)LP={lesson:lid,chat:[]};
 const cache=LCACHE[lid];if(!cache)loadLesson(lid);
 const data=lessonData(lid);
 const req=data?data.blocks.filter(b=>b.req):[];const reqDone=req.filter(blockDone).length;
 const pct=data?(req.length?Math.round(reqDone/req.length*100):100):0;
 const next=ls[idx+1];
 let body;
 if(cache&&cache.locked)body=lockedHTML(c);
 else if(cache&&cache.error)body=`<div class="card empty"><b>Не удалось загрузить урок</b><button class="btn" data-act="retryLesson" data-arg="${lid}">Повторить</button></div>`;
 else if(!data)body=`<div class="col" style="gap:14px"><div class="skel" style="height:44px;width:70%"></div><div class="skel" style="height:18px"></div><div class="skel" style="height:160px"></div></div>`;
 else body=data.blocks.map((b,i)=>renderBlock(b,i,lid)).join('')+`
  <div class="card row between" style="margin-top:40px;gap:16px"><div class="col" style="gap:2px"><b>${reqDone<req.length?`Осталось заданий: ${req.length-reqDone}`:'Урок пройден'}</b><span class="small muted">${reqDone<req.length?'Ответьте на вопросы выше.':next?'Переходите к следующему уроку.':'Это был последний урок.'}</span></div>
  ${next?`<button class="btn" data-act="nextLesson" data-arg="${lid}" ${reqDone<req.length?'disabled':''}>Следующий урок ${ic('arrow','ico s')}</button>`:`<a class="btn" href="#course-${c.id}">К курсу</a>`}</div>`;
 return `<div class="lbar"><div class="in">
   <button class="iconbtn" data-act="toggleToc" aria-label="Содержание">${ic('menu')}</button>
   <div class="col" style="gap:5px;flex:1;min-width:0"><span class="ttl">${esc(l.t)}</span><div class="row" style="gap:10px;flex-wrap:nowrap"><div class="progress" style="flex:1;max-width:240px"><i style="width:${pct}%"></i></div><span class="tiny muted" style="white-space:nowrap">${idx+1} из ${ls.length}</span></div></div>
   ${c.price>0?`<button class="btn sm hide-xs" data-act="lead" data-arg="buy" data-lead-item="${c.id}" ${cta('buy_course',c.id,'lesson')}>Купить курс</button>`:''}
   <a class="iconbtn" href="#course-${c.id}" aria-label="Закрыть урок">${ic('x')}</a>
 </div></div>
 <div class="lesson-layout">
 <aside class="toc" id="toc"><a href="#course-${c.id}" style="font-weight:600;color:var(--ink)">${ic('back','ico s')} ${esc(c.title)}</a>
  ${c.modules.map(m=>`<div class="mh">${esc(m.t)}</div>${m.l.map(x=>`<a href="#lesson-${x.id}" class="${x.id===lid?'on':''}"><span class="dot ${S.done[x.id]?'done':''}">${S.done[x.id]?ic('check','ico',2.5):''}</span><span style="flex:1">${esc(x.t)}</span>${!isOpen(c,x)?`<span class="muted">${ic('lock','ico s')}</span>`:''}</a>`).join('')}`).join('')}
 </aside>
 <div class="lesson-main"><div class="reader">${body}
  <div class="row between" style="margin-top:28px">${idx>0?`<a class="btn ghost sm" href="#lesson-${ls[idx-1].id}">${ic('back','ico s')} Назад</a>`:'<span></span>'}${next?`<a class="btn ghost sm" href="#lesson-${next.id}">Далее ${ic('arrow','ico s')}</a>`:''}</div>
 </div></div></div>
 ${data&&!(cache&&cache.locked)?`<button class="btn dark fab" data-act="toggleMentor">${ic('spark','ico s',2)} <span class="hide-xs">ИИ-наставник</span></button>${mentorPanel()}`:''}`}
function lockedHTML(c){const bp=bestPlan();return `<div class="card lock"><span class="tile">${ic('lock')}</span><h2 style="font-size:28px">Урок доступен в полной версии</h2><p class="muted" style="max-width:420px">Оставьте заявку — менеджер откроет доступ к курсу.</p>
 <div class="row" style="justify-content:center"><button class="btn lg" data-act="lead" data-arg="buy" data-lead-item="${c.id}" ${cta('buy_course',c.id,'lesson')}>Купить курс · ${fmt(c.price)}</button>${bp?`<button class="btn ghost lg" data-act="lead" data-arg="plan" data-lead-item="${bp.id}" ${cta('subscribe',bp.id,'lesson')}>Оформить подписку</button>`:''}</div></div>`}
function blockDone(b){if(b.t==='quiz')return !!(S.quiz[b.id]&&S.quiz[b.id].ok);if(b.t==='sandbox')return !!(S.quiz[b.id]&&S.quiz[b.id].score>=7);return true}
const CALL_IC={tip:'bulb',important:'info',error:'warn',example:'check'};
function renderBlock(b,i,lid){
 if(b.t==='text')return `<div class="block txt" data-sel>${b.html}</div>`;
 if(b.t==='callout')return `<div class="block"><div class="callout ${b.kind}" data-sel><span class="ci">${ic(CALL_IC[b.kind]||'info')}</span><div><div class="h">${esc(b.h)}</div><div>${b.html}</div></div></div></div>`;
 if(b.t==='diagram')return `<div class="block"><div class="card" style="padding:18px;background:#fff">${b.svg}<p class="small" style="text-align:center;margin-top:8px;color:#71717A">${esc(b.cap)}</p></div></div>`;
 if(b.t==='formula')return `<div class="block"><div class="formula">${b.html}<div class="cap">${esc(b.cap)}</div></div></div>`;
 if(b.t==='code')return `<div class="block"><div class="code"><div class="hd"><span>${esc(b.lang)}</span><button data-act="copy" data-arg="${i}">${ic('copy','ico s')} Копировать</button></div><pre>${hl(b.code,b.lang)}</pre></div></div>`;
 if(b.t==='quiz'){const st=S.quiz[b.id];return `<div class="block quiz"><span class="eyebrow">Проверьте себя</span><h3 style="margin:8px 0 2px;font-size:20px">${esc(b.q)}</h3>
  ${b.opts.map((o,k)=>{const pk=st&&st.pick===k;return `<button class="opt ${pk?(o.ok?'ok':'bad'):''}" data-act="quiz" data-arg="${lid}|${i}|${k}"><span class="l">${pk?(o.ok?ic('check','ico s',2.5):ic('x','ico s',2.5)):String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></button>${pk?`<div class="why"><b>${o.ok?'Верно. ':'Не совсем. '}</b>${esc(o.why)}</div>`:''}`}).join('')}</div>`}
 if(b.t==='sandbox')return sandboxHTML(b);
 return ''}
function hl(code,lang){let h=esc(code);if(lang==='Python'){h=h.replace(/(#.*)$/gm,'<span class="c">$1</span>').replace(/\b(from|import|print|def|return|for|in)\b/g,'<span class="k">$1</span>').replace(/\b(LinearRegression|fit|predict)\b/g,'<span class="fn">$1</span>')}else{h=h.replace(/(&quot;[a-z]+&quot;)/g,'<span class="s">$1</span>')}return h}

function checksHTML(st){return `<div class="col" style="gap:4px"><div class="row between"><span class="lbl">Результат</span><span style="font-family:Manrope;font-weight:800;font-size:28px;color:${st.score>=7?'#4ADE80':'#FF9A5C'}">${st.score}/10</span></div>

function fakeModel(prompt,contract){const p=prompt.toLowerCase();
 const amount=Number((contract.match(/(?:составляет|услуг —)\s*([\d\s]+)\s*\(/)||[])[1]?.replace(/\s/g,'')||0);
 const dm=contract.match(/(\d{1,2})\s+(декабря|марта)\s+(\d{4})/);const mon={декабря:'12',марта:'03'};
 const iso=dm?`${dm[3]}-${mon[dm[2]]}-${dm[1].padStart(2,'0')}`:'';const human=dm?`${dm[1]} ${dm[2]} ${dm[3]}`:'';
 const pen=(contract.match(/(\d+,\d+)%/)||[])[1]||'';
 if(!/json/.test(p))return `В договоре указана сумма ${amount.toLocaleString('ru-RU')} сум, срок — ${human} года, пеня — ${pen}% за каждый день просрочки.`;
 const keys=/amount|deadline|penalty/.test(p)?['amount','deadline','penalty']:['сумма','срок','штраф'];
 const numPen=/числ|number|0\.1|процент/.test(p),isoD=/гггг|yyyy|iso|\d{4}-\d{2}/.test(p),onlyJson=/только|only|без поясн|без текста/.test(p);
 const obj={};obj[keys[0]]=/числ|number|сум/.test(p)?amount:amount.toLocaleString('ru-RU')+' сум';obj[keys[1]]=isoD?iso:human;obj[keys[2]]=numPen?Number(pen.replace(',','.')):pen+'% в день';
 const js=JSON.stringify(obj,null,2);return onlyJson?js:'Вот данные из договора:\n'+js}
function extractJSON(s){const m=s.match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}
function checkOne(text,exp){const o=extractJSON(text);const r={json:!!o,amount:false,deadline:false,penalty:false};if(!o)return r;
 r.amount=typeof o.amount==='number'&&o.amount===exp.amount;r.deadline=o.deadline===exp.deadline;const pv=o.penalty;r.penalty=typeof pv==='number'&&(Math.abs(pv-exp.penalty)<1e-9||Math.abs(pv-exp.penalty/100)<1e-9);return r}

/* ---- наставник ---- */
function mentorPanel(){return `<aside class="drawer" id="mentor" aria-label="ИИ-наставник"><div class="hd"><b class="row" style="gap:8px">${ic('spark','ico s',2)} ИИ-наставник</b><button class="iconbtn" data-act="toggleMentor" aria-label="Закрыть">${ic('x')}</button></div>
 <div class="msgs" id="msgs">${LP.chat.length?LP.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):`<div class="msg a">Спросите, что непонятно, или выделите текст в уроке — объясню проще.</div>`}</div>
 <div class="row" style="padding:0 12px 8px;gap:6px">${['Объясни проще','Дай пример'].map(q=>`<button class="chip" data-act="mentorQuick" data-arg="${q}">${q}</button>`).join('')}</div>
 <form data-submit="mentor"><input id="mentorIn" placeholder="Ваш вопрос…" autocomplete="off"><button class="btn" aria-label="Отправить">${ic('send','ico s')}</button></form></aside>`}
function openMentor(){document.getElementById('mentor')?.classList.add('open')}
async function mentorAsk(q){if(S.mentor.day!==today())S.mentor={day:today(),n:0};if(S.mentor.n>=10){toast('Дневной лимит вопросов исчерпан');return}
 S.mentor.n++;save();LP.chat.push({role:'user',content:q});const box=document.getElementById('msgs');if(!box)return;
 box.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div><div class="msg a" id="pending">…</div>`);box.scrollTop=box.scrollHeight;
 await new Promise(r=>setTimeout(r,600));const ans=fakeMentor(q);const el=document.getElementById('pending');if(el){el.textContent=ans;el.removeAttribute('id')}LP.chat.push({role:'assistant',content:ans});box.scrollTop=box.scrollHeight}
function fakeMentor(q){const s=q.toLowerCase();
 if(s.includes('прощ'))return 'Проще: языковая модель — очень начитанный автодополнитель. Она не ищет ответ в базе, а дописывает самый правдоподобный текст.';
 if(s.includes('пример'))return 'Пример: вместо «Найди данные» напишите «Ты юрист. Верни только JSON с полями amount (число), deadline (ГГГГ-ММ-ДД), penalty (число)».';
 if(s.includes('промпт')||s.includes('задани'))return 'Подсказка: укажите роль, задачу, точный формат ответа (JSON с полями и типами) и запретите лишний текст.';
 return 'Хороший вопрос! Хороший промпт — это роль, задача, формат и пример. Выделите непонятный фрагмент — объясню подробнее.'}

function pBusiness(){return `<section class="hero"><div class="wrap hero-grid" style="align-items:start">
 <div class="col" style="gap:28px"><h1 style="font-size:clamp(36px,5vw,58px)">Обучим команду работать с&nbsp;ИИ</h1>
  <p class="lead">Курсы под задачи вашего бизнеса и отчёт по каждому сотруднику.</p>
  <div class="col" style="gap:22px;margin-top:8px">${[['users','Пакет мест','Лицензии на нужное число сотрудников'],['layers','Программа под отрасль','Задания на реальных задачах компании'],['chart','Отчёты для HR','Прогресс и результаты каждого сотрудника']].map(x=>`<div class="row" style="gap:16px;flex-wrap:nowrap;align-items:flex-start"><span class="tile">${ic(x[0])}</span><div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></div></div>`).join('')}</div>
 </div>
 <div class="card" style="box-shadow:var(--sh)"><div class="col" style="gap:8px;margin-bottom:22px"><h3 style="font-size:24px">Получите предложение</h3><p class="muted">Ответим в течение рабочего дня.</p></div>${leadForm({type:'business',fields:['company','message'],cta:'Получить предложение'})}</div>
 </div></section>`}
function pPrivacy(){return `<section style="padding-top:48px"><div class="wrap narrow col" style="gap:18px"><h1 style="font-size:clamp(32px,4.4vw,44px)">Политика конфиденциальности</h1>
 <p>Мы собираем имя и номер телефона, которые вы оставляете в форме заявки, только чтобы связаться с вами по поводу обучения. Данные не передаются третьим лицам.</p>
 <p>Для улучшения сайта мы собираем обезличенную статистику посещений: какие страницы открывались, с какого устройства и из какого источника был переход.</p>
 <p>Чтобы удалить ваши данные, напишите нам${SETTINGS.contactTelegram?` в Telegram ${esc(SETTINGS.contactTelegram)}`:''}${SETTINGS.contactPhone?` или позвоните по номеру ${esc(SETTINGS.contactPhone)}`:''}.</p></div></section>`}
function pNotFound(){return `<section><div class="wrap empty"><h2>Страница не найдена</h2><a class="btn" href="#home">На главную</a></div></section>`}

/* ================== ROUTER ================== */
let pricingObs=null;
function render(){const r=location.hash.slice(1)||'home';const isLesson=r.startsWith('lesson-');let html;
 if(r==='home')html=pHome();else if(r==='catalog')html=pCatalog();else if(r.startsWith('course-'))html=pCourse(r.slice(7));
 else if(isLesson)html=pLesson(r.slice(7));else if(r==='pricing')html=pricingSection(false);else if(r==='business')html=pBusiness();else if(r==='privacy')html=pPrivacy();else html=pNotFound();
 document.getElementById('hdr').style.display=isLesson?'none':'';document.getElementById('footer').style.display=isLesson?'none':'';
 if(!isLesson)renderNav();document.getElementById('app').innerHTML=html;if(!isLesson)renderFoot();
 pricingObs?.disconnect();const pg=document.getElementById('pricingGrid');
 if(pg&&'IntersectionObserver' in window){pricingObs=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){T.ev('view','pricing');pricingObs.disconnect()}},{threshold:.4});pricingObs.observe(pg)}}
const TITLES={home:'AI Master — обучение ИИ на практике',catalog:'Курсы — AI Master',pricing:'Цены — AI Master',business:'Обучение для компаний — AI Master',privacy:'Конфиденциальность — AI Master'};
function setTitle(r){const c=r.startsWith('course-')&&course(r.slice(7));const l=r.startsWith('lesson-')&&findLesson(r.slice(7));document.title=c?c.title+' — AI Master':l?l.l.t+' — AI Master':TITLES[r]||'AI Master'}
let lastRoute='';
function onRoute(){const r=location.hash.slice(1)||'home';sheetOpen=false;const changed=r!==lastRoute;lastRoute=r;setTitle(r);render();
 if(changed){window.scrollTo({top:0,left:0,behavior:'instant'});T.ev('pv','',{},r);PX.page()}}
addEventListener('hashchange',onRoute);
addEventListener('scroll',()=>document.getElementById('hdr').classList.toggle('scrolled',scrollY>8),{passive:true});

/* ================== EVENTS ================== */
function lessonBlocks(lid){return lessonData(lid)?.blocks||[]}
document.addEventListener('click',async e=>{
 const tr=e.target.closest('[data-cta]');
 if(tr){const id=tr.dataset.cta;T.ev('click',id,{item:tr.dataset.item||'',place:tr.dataset.place||''});if(id==='subscribe'||id==='buy_course')PX.goal(id,{content_name:tr.dataset.item||''})}
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,arg=a.dataset.arg;
 if(a.tagName==='A'&&!['pickAud','closeModal'].includes(act))e.preventDefault();
 switch(act){
  case 'closeModal':if(a.classList.contains('modal-bg')&&e.target!==a)break;closeModal();break;
  case 'burger':sheetOpen=!sheetOpen;renderNav();break;
  case 'lead':openLead(arg,a.dataset.leadItem);break;
  case 'pickAud':catF={q:'',aud:arg};break;
  case 'catAud':catF.aud=arg;refreshCatalog();break;
  case 'catReset':catF={q:'',aud:''};render();break;
  case 'planPick':{planSel=arg;const y=scrollY;render();scrollTo({top:y,behavior:'instant'});break}
  case 'toggleMentor':document.getElementById('mentor')?.classList.toggle('open');setTimeout(()=>document.getElementById('mentorIn')?.focus(),250);break;
  case 'toggleToc':document.getElementById('toc')?.classList.toggle('open');break;
  case 'retryLesson':delete LCACHE[arg];render();break;
  case 'copy':{const b=lessonBlocks(location.hash.slice(8))[arg];try{await navigator.clipboard.writeText(b.code);toast('Скопировано')}catch(_){toast('Не удалось скопировать')}break}
  case 'quiz':{const [lid,bi,k]=arg.split('|');const b=lessonBlocks(lid)[bi];if(!b)break;const prev=S.quiz[b.id];S.quiz[b.id]={pick:Number(k),ok:b.opts[k].ok||!!(prev&&prev.ok)};save();const y=scrollY;render();scrollTo({top:y,behavior:'instant'});break}
  case 'nextLesson':{S.done[arg]=true;save();T.ev('lesson',arg,{a:'done'});const ls=allLessons(findLesson(arg).c);const i=ls.findIndex(x=>x.id===arg);go('lesson-'+ls[i+1].id);break}
  case 'sbCheck':{const p=document.getElementById('sbPrompt').value.trim();if(p.length<10){toast('Напишите промпт подлиннее');break}if(!useRun())break;
    const out=document.getElementById('sbOut');out.textContent='Модель думает…';a.disabled=true;await new Promise(r=>setTimeout(r,700));
    const st={prompt:p};const t1=fakeModel(p,CONTRACT_A),t2=fakeModel(p,CONTRACT_B);out.textContent=t1;st.out=t1;
    const A=checkOne(t1,EXPECT_A),B=checkOne(t2,EXPECT_B);let score=0;const checks=[];
    const both=(k,pts,okT,badT)=>{const ok=A[k]&&B[k];if(ok)score+=pts;checks.push({ok,t:ok?okT:badT})};
    both('json',3,'Ответ — валидный JSON','Попросите вернуть только JSON без пояснений');
    both('amount',2,'Сумма — число и совпадает','amount должен быть числом в сумах');
    both('deadline',2,'Срок в формате ГГГГ-ММ-ДД','deadline должен быть строкой вида 2026-12-31');
    both('penalty',3,'Пеня — число и совпадает','penalty должен быть числом, например 0.1');
    st.score=score;st.checks=checks;S.quiz[arg]=st;save();const y=scrollY;render();scrollTo({top:y,behavior:'instant'});break}
  case 'sbHint':openMentor();mentorAsk('Подскажи, с чего начать это задание');break;
  case 'mentorQuick':mentorAsk(arg+(selText?`: «${selText}»`:''));selText='';break;
 }
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.matches('[data-phone]')){const v=fmtPhone(el.value);if(v!==el.value)el.value=v}
 if(el.dataset.input==='catq'){catF.q=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}});
document.addEventListener('submit',async e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();
 if(k==='lead'){const btn=f.querySelector('button');const fd=Object.fromEntries(new FormData(f).entries());
  if(fd.phone.replace(/\D/g,'').length<12){toast('Введите номер полностью: +998 XX XXX XX XX');return}
  btn.disabled=true;const label=btn.textContent;btn.textContent='Отправляем…';
  try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fd,page:location.hash.slice(1)||'home',...T.ctx()})});
   const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Не удалось отправить. Попробуйте ещё раз.');
   PX.goal('lead',{content_name:fd.type});f.parentElement.innerHTML=leadSuccess()}
  catch(er){toast(er.message==='Failed to fetch'?'Нет связи с сервером':er.message);btn.disabled=false;btn.textContent=label}return}
 if(k==='mentor'){const i=document.getElementById('mentorIn');const q=i.value.trim();if(!q)return;i.value='';mentorAsk(q)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('mentor')?.classList.remove('open');if(sheetOpen){sheetOpen=false;renderNav()}}});
let selText='';
document.addEventListener('mouseup',e=>{setTimeout(()=>{const s=window.getSelection();const txt=s?String(s).trim():'';const an=s&&s.anchorNode&&s.anchorNode.parentElement;if(txt.length>3&&an&&an.closest('[data-sel]'))selText=txt.slice(0,400)},10)});

/* ================== BOOT ================== */
(async function boot(){
 try{const r=await fetch('/api/catalog');if(!r.ok)throw new Error();const j=await r.json();COURSES=j.courses;PLANS=j.plans;SETTINGS=j.settings}
 catch(e){document.getElementById('app').innerHTML=`<div class="wrap empty" style="padding:120px 20px"><h2>Сайт временно недоступен</h2><button class="btn" onclick="location.reload()">Обновить</button></div>`;return}
 PX.init(SETTINGS);onRoute();
})();
