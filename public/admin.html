<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админ-панель — AI Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F1;--bg2:#EEECE6;--card:#fff;--ink:#14161F;--ink2:#3A3D48;--muted:#6E6C66;--line:#E6E3DB;--brand:#FF6B1A;--brand-ink:#B24A0B;--brand-soft:#FFF0E5;--indigo:#3B4FD8;--indigo-soft:#ECEFFF;--green:#16834A;--green-soft:#E3F5EA;--red:#C2410C;--red-soft:#FDE8DD;--amber:#A16207;--amber-soft:#FEF6DA;--sh:0 1px 2px rgba(20,22,31,.05),0 6px 20px rgba(20,22,31,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1016;--bg2:#181B24;--card:#1A1D27;--ink:#F1EFEA;--ink2:#CFCCC4;--muted:#9B988F;--line:#2A2D39;--brand-ink:#FF9A5C;--brand-soft:#33221A;--indigo:#8C9BFF;--indigo-soft:#1D2240;--green:#5ACB86;--green-soft:#15291E;--red:#FF8A5B;--red-soft:#361D14;--amber:#F5C451;--amber-soft:#2E2610;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}a{color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--brand) 25%,transparent);border-color:var(--brand)}
textarea{resize:vertical}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.2}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;background:var(--brand);color:#14161F;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--bg2)}
.btn.danger{background:var(--red-soft);color:var(--red)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.o{background:var(--brand-soft);color:var(--brand-ink)}.pill.g{background:var(--green-soft);color:var(--green)}.pill.b{background:var(--indigo-soft);color:var(--indigo)}.pill.r{background:var(--red-soft);color:var(--red)}.pill.y{background:var(--amber-soft);color:var(--amber)}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static!important;height:auto!important;flex-direction:row!important;overflow:auto}.side .brand,.side .foot{display:none}.side a{white-space:nowrap}}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-family:Manrope;font-weight:800;font-size:17px;padding:4px 8px 18px}
.brand b{color:var(--brand)}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:600}
.side a:hover{background:var(--bg2)}.side a.on{background:var(--brand-soft);color:var(--brand-ink)}
.side .cnt{background:var(--brand);color:#14161F;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:800}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
main{padding:28px;min-width:0}
@media(max-width:600px){main{padding:16px}}
.stat .v{font-family:Manrope;font-weight:800;font-size:28px;letter-spacing:-.02em}
.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--bg)}
.tablewrap{overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 13px;font-weight:600;font-size:13.5px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,12,18,.4);z-index:50}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:51;overflow:auto;padding:24px;box-shadow:-20px 0 60px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:100;font-weight:600;font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}.chk input{width:auto;accent-color:var(--brand)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b span{font-size:10.5px;color:var(--muted)}
.blk{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.empty{padding:36px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
const TOKEN_KEY='aimaster_admin';
let TK=sessionStorage.getItem(TOKEN_KEY)||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU').replace(/ |,/g,' ')+' сум';
const dt=s=>s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
async function api(p,{method='GET',body}={}){const r=await fetch('/api/admin'+p,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/login'){TK='';sessionStorage.removeItem(TOKEN_KEY);render();throw new Error(j.error||'Нужно войти')}if(!r.ok)throw new Error(j.error||'Ошибка '+r.status);return j}
const LEAD_ST={new:['Новая','o'],work:['В работе','b'],done:['Успешно','g'],rejected:['Отказ','']};
const TYPES={consult:'Подбор курса',business:'Компания',course:'Вопрос по курсу','level-test':'Тест уровня'};
let D={stats:null,leads:[],users:[],orders:[],courses:[],plans:[],promos:[],settings:null};
let leadF={status:'',type:'',q:''};
let route='dash';

function closeLayer(){document.getElementById('layer').innerHTML=''}
function drawer(html){document.getElementById('layer').innerHTML=`<div class="drawer-bg" data-act="closeLayer"></div><div class="drawer">${html}</div>`}

/* ---------- login ---------- */
function pLogin(){return `<div class="login"><form class="card col" style="width:100%;max-width:380px;gap:16px;padding:28px" data-submit="login">
 <div class="brand" style="padding:0"><svg width="34" height="34" viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="#FF6B1A"/><path d="M32 42 L56 62 L32 82" fill="none" stroke="#14161F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 84 H86" stroke="#14161F" stroke-width="12" stroke-linecap="round"/></svg><span><b>AI</b> Master · админ</span></div>
 <label class="f">Логин<input name="login" autocomplete="username" required></label><label class="f">Пароль<input name="password" type="password" autocomplete="current-password" required></label>
 <button class="btn" style="padding:12px">Войти</button></form></div>`}

/* ---------- layout ---------- */
function shell(body){const nNew=D.stats?.leadsNew||0;
 const items=[['dash','Дашборд'],['leads','Заявки',nNew],['users','Пользователи'],['orders','Заказы'],['courses','Курсы'],['pricing','Тарифы и промокоды'],['settings','Настройки']];
 return `<div class="layout"><nav class="side"><div class="brand"><svg width="30" height="30" viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="#FF6B1A"/><path d="M32 42 L56 62 L32 82" fill="none" stroke="#14161F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 84 H86" stroke="#14161F" stroke-width="12" stroke-linecap="round"/></svg><span><b>AI</b> Master</span></div>
 ${items.map(([k,l,n])=>`<a href="#${k}" class="${route===k||route.startsWith(k+'/')?'on':''}"><span>${l}</span>${n?`<span class="cnt">${n}</span>`:''}</a>`).join('')}
 <div class="foot"><a href="/" target="_blank">Открыть сайт ↗</a><a href="#" data-act="logout">Выйти</a></div></nav><main id="main">${body}</main></div>`}

/* ---------- dashboard ---------- */
function pDash(){const s=D.stats;if(!s)return '<div class="empty">Загрузка…</div>';const max=Math.max(1,...s.days.map(d=>d.leads));
 return `<div class="col" style="gap:20px"><div class="row between"><h1>Дашборд</h1><button class="btn ghost sm" data-act="reload">Обновить</button></div>
 ${s.tgFailed?`<div class="card row between" style="background:var(--red-soft);border-color:transparent"><span><b>${s.tgFailed}</b> заявок не дошли до Telegram. Проверьте настройки бота.</span><a class="btn sm dark" href="#settings">Настройки</a></div>`:''}
 <div class="grid g4">${[['Новые заявки',s.leadsNew,'Ждут обработки'],['Заявок за 7 дней',s.leads7,'Всего: '+s.leadsTotal],['Пользователи',s.users,'+'+s.users7+' за неделю'],['Выручка за 30 дней',fmt(s.revenue30),'Подписок активно: '+s.activeSubs]].map(x=>`<div class="card stat"><div class="small muted">${x[0]}</div><div class="v">${x[1]}</div><div class="tiny muted">${x[2]}</div></div>`).join('')}</div>
 <div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
  <div class="card col"><h3>Заявки за 14 дней</h3><div class="bars">${s.days.map(d=>`<div class="b" title="${d.day}: ${d.leads}"><span>${d.leads||''}</span><i style="height:${d.leads/max*90}%"></i><span>${d.day.slice(8)}</span></div>`).join('')}</div>
   <div class="row small muted">${s.byType.map(x=>`<span class="pill">${TYPES[x.type]}: ${x.n}</span>`).join('')}</div></div>
  <div class="card col"><div class="row between"><h3>Последние заявки</h3><a class="btn ghost sm" href="#leads">Все</a></div>
   ${s.recentLeads.length?s.recentLeads.map(l=>`<div class="row between" style="cursor:pointer" data-act="openLead" data-arg="${l.id}"><div class="col" style="gap:0"><b>${esc(l.name)}</b><span class="tiny muted">${esc(l.phone)} · ${TYPES[l.type]||l.type}</span></div><span class="pill ${LEAD_ST[l.status][1]}">${LEAD_ST[l.status][0]}</span></div>`).join(''):'<p class="muted small">Заявок пока нет</p>'}</div>
 </div></div>`}

/* ---------- leads ---------- */
function leadsFiltered(){const q=leadF.q.toLowerCase();return D.leads.filter(l=>(!leadF.status||l.status===leadF.status)&&(!leadF.type||l.type===leadF.type)&&(!q||(l.name+l.phone+l.company+l.message+l.courseTitle).toLowerCase().includes(q)))}
function pLeads(){const L=leadsFiltered();
 return `<div class="col" style="gap:16px"><div class="row between"><h1>Заявки</h1><div class="row"><button class="btn ghost sm" data-act="reload">Обновить</button><a class="btn ghost sm" href="#" data-act="csv">Скачать CSV</a></div></div>
 <div class="row"><div class="tabs">${[['','Все'],...Object.entries(LEAD_ST).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="${leadF.status===k?'on':''}" data-act="lf" data-arg="status|${k}">${l} <span class="muted">${k?D.leads.filter(x=>x.status===k).length:D.leads.length}</span></button>`).join('')}</div>
 <select style="width:auto" data-change="lftype"><option value="">Все типы</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${leadF.type===k?'selected':''}>${v}</option>`).join('')}</select>
 <input style="max-width:260px" placeholder="Поиск: имя, телефон, компания" value="${esc(leadF.q)}" data-input="lq"></div>
 <div class="card tablewrap" style="padding:6px 10px" id="leadTable">${leadTable(L)}</div></div>`}
function leadTable(L){return L.length?`<table class="t"><tr><th>#</th><th>Дата</th><th>Имя</th><th>Телефон</th><th>Тип</th><th>Детали</th><th>Статус</th><th>Telegram</th></tr>${L.map(l=>`<tr class="click" data-act="openLead" data-arg="${l.id}"><td class="muted">${l.id}</td><td class="small">${dt(l.createdAt)}</td><td><b>${esc(l.name)}</b></td><td style="white-space:nowrap">${esc(l.phone)}</td><td><span class="pill">${TYPES[l.type]||l.type}</span></td><td class="small muted" style="max-width:260px">${esc([l.company,l.size,l.courseTitle,l.message].filter(Boolean).join(' · ').slice(0,90))}</td><td><span class="pill ${LEAD_ST[l.status][1]}">${LEAD_ST[l.status][0]}</span></td><td>${l.tg?.ok?'<span class="pill g">✓</span>':`<span class="pill r" title="${esc(l.tg?.error)}">!</span>`}</td></tr>`).join('')}</table>`:'<div class="empty">Заявок не найдено</div>'}
function openLead(id){const l=D.leads.find(x=>x.id===Number(id));if(!l)return;
 drawer(`<div class="row between"><h2>Заявка #${l.id}</h2><button class="btn ghost sm" data-act="closeLayer">✕</button></div>
 <div class="row"><span class="pill">${TYPES[l.type]||l.type}</span><span class="tiny muted">${dt(l.createdAt)}</span></div>
 <dl class="kv"><dt>Имя</dt><dd><b>${esc(l.name)}</b></dd><dt>Телефон</dt><dd><a href="tel:${esc(l.phone.replace(/\s/g,''))}">${esc(l.phone)}</a></dd>
 ${l.company?`<dt>Компания</dt><dd>${esc(l.company)}</dd>`:''}${l.size?`<dt>Сотрудников</dt><dd>${esc(l.size)}</dd>`:''}${l.courseTitle?`<dt>Курс</dt><dd>${esc(l.courseTitle)}</dd>`:''}
 ${l.goal?`<dt>Ответы теста</dt><dd>${esc(l.goal)}</dd>`:''}${l.contactWay?`<dt>Связаться</dt><dd>${esc(l.contactWay)}</dd>`:''}${l.message?`<dt>Комментарий</dt><dd>${esc(l.message)}</dd>`:''}<dt>Страница</dt><dd>${esc(l.page||'—')}</dd>
 <dt>Telegram</dt><dd>${l.tg?.ok?'<span class="pill g">Отправлено</span>':`<span class="pill r">Не отправлено</span> <span class="tiny muted">${esc(l.tg?.error||'')}</span>`}</dd></dl>
 <div class="col"><b class="small">Статус</b><div class="tabs">${Object.entries(LEAD_ST).map(([k,v])=>`<button class="${l.status===k?'on':''}" data-act="leadStatus" data-arg="${l.id}|${k}">${v[0]}</button>`).join('')}</div></div>
 <label class="f">Заметка менеджера<textarea id="leadNote" rows="4" placeholder="Итог звонка, договорённости…">${esc(l.note)}</textarea></label>
 <div class="row"><button class="btn" data-act="leadNote" data-arg="${l.id}">Сохранить заметку</button><button class="btn ghost" data-act="leadResend" data-arg="${l.id}">Отправить в Telegram ещё раз</button></div>
 <div style="margin-top:auto"><button class="btn danger sm" data-act="leadDel" data-arg="${l.id}">Удалить заявку</button></div>`)}

/* ---------- users ---------- */
let userQ='';
function pUsers(){const q=userQ.toLowerCase();const U=D.users.filter(u=>!q||(u.name+u.phone).toLowerCase().includes(q));
 return `<div class="col" style="gap:16px"><div class="row between"><h1>Пользователи <span class="muted" style="font-size:18px">${D.users.length}</span></h1><input style="max-width:280px" placeholder="Поиск: имя или телефон" value="${esc(userQ)}" data-input="uq"></div>
 <div class="card tablewrap" style="padding:6px 10px">${U.length?`<table class="t"><tr><th>ID</th><th>Имя</th><th>Телефон</th><th>Регистрация</th><th>Был</th><th>Уроков</th><th>Доступ</th></tr>${U.map(u=>`<tr class="click" data-act="openUser" data-arg="${u.id}"><td class="muted">${u.id}</td><td><b>${esc(u.name)}</b></td><td>${esc(u.phone)}</td><td class="small">${dt(u.createdAt)}</td><td class="small">${dt(u.lastSeen)}</td><td>${u.done}</td><td>${u.sub&&u.sub.status==='active'&&new Date(u.sub.until)>new Date()?'<span class="pill g">Подписка</span>':''}${u.owned.length?`<span class="pill b">${u.owned.length} курс.</span>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Пользователей пока нет</div>'}</div></div>`}
function openUser(id){const u=D.users.find(x=>x.id===Number(id));if(!u)return;const subOn=u.sub&&u.sub.status==='active'&&new Date(u.sub.until)>new Date();
 drawer(`<div class="row between"><h2>${esc(u.name)}</h2><button class="btn ghost sm" data-act="closeLayer">✕</button></div>
 <dl class="kv"><dt>Телефон</dt><dd>${esc(u.phone)}</dd><dt>Регистрация</dt><dd>${dt(u.createdAt)}</dd><dt>Последний визит</dt><dd>${dt(u.lastSeen)}</dd><dt>XP / уроков</dt><dd>${u.xp} / ${u.done}</dd><dt>Оплат</dt><dd>${u.orders}</dd>
 <dt>Подписка</dt><dd>${subOn?`до ${new Date(u.sub.until).toLocaleDateString('ru-RU')} (${esc(u.sub.method)})`:'нет'}</dd></dl>
 <div class="col"><b class="small">Купленные курсы</b>${u.owned.length?u.owned.map(c=>`<div class="row between"><span>${esc(D.courses.find(x=>x.id===c)?.title||c)}</span><button class="btn ghost sm" data-act="userRevoke" data-arg="${u.id}|${c}">Забрать</button></div>`).join(''):'<span class="muted small">Нет</span>'}
 <div class="row" style="flex-wrap:nowrap"><select id="grantC">${D.courses.filter(c=>!u.owned.includes(c.id)&&c.price>0).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><button class="btn ghost" data-act="userGrant" data-arg="${u.id}">Выдать курс</button></div></div>
 <div class="col"><b class="small">Подписка</b><div class="row">${[1,3,12].map(m=>`<button class="btn ghost sm" data-act="userSub" data-arg="${u.id}|${m}">Выдать ${m} мес</button>`).join('')}${subOn?`<button class="btn danger sm" data-act="userSubOff" data-arg="${u.id}">Отключить</button>`:''}</div></div>`)}

/* ---------- orders ---------- */
function pOrders(){const O=D.orders;const st={pending:['Ожидает','b'],paid:['Оплачен','g'],cancelled:['Отменён',''],refunded:['Возврат','r']};
 return `<div class="col" style="gap:16px"><div class="row between"><h1>Заказы</h1><span class="muted small">Выручка всего: <b>${fmt(O.filter(o=>o.status==='paid').reduce((a,o)=>a+o.amount,0))}</b></span></div>
 <div class="card tablewrap" style="padding:6px 10px">${O.length?`<table class="t"><tr><th>Заказ</th><th>Дата</th><th>Клиент</th><th>Товар</th><th>Способ</th><th>Сумма</th><th>Статус</th><th></th></tr>${O.map(o=>`<tr><td><b>${esc(o.id)}</b>${o.demo?' <span class="pill y">демо</span>':''}</td><td class="small">${dt(o.createdAt)}</td><td>${esc(o.user)}</td><td>${esc(o.title)}${o.promo?` <span class="tiny muted">(${esc(o.promo)})</span>`:''}</td><td>${esc(o.method)}</td><td style="white-space:nowrap">${fmt(o.amount)}</td><td><span class="pill ${st[o.status]?.[1]||''}">${st[o.status]?.[0]||o.status}</span></td><td>${o.status==='paid'?`<button class="btn ghost sm" data-act="refund" data-arg="${o.id}">Возврат</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">Заказов пока нет</div>'}</div>

/* ---------- courses ---------- */

const AUD={beginner:'Новичкам',work:'Для работы',business:'Для бизнеса',dev:'Разработчикам'};
function pCourses(){return `<div class="col" style="gap:16px"><div class="row between"><h1>Курсы</h1><button class="btn" data-act="newCourse">+ Новый курс</button></div>
 <div class="card tablewrap" style="padding:6px 10px"><table class="t"><tr><th></th><th>Курс</th><th>Аудитория</th><th>Уроков</th><th>Цена</th><th>Статус</th><th></th></tr>
 ${D.courses.slice().sort((a,b)=>a.order-b.order).map(c=>`<tr class="click" data-act="goCourse" data-arg="${c.id}"><td><div style="width:36px;height:36px;border-radius:9px;background:${COVERS[c.cover]||COVERS.a}"></div></td><td><b>${esc(c.title)}</b><div class="tiny muted">${esc(c.id)} · ${esc(c.level)}</div></td><td>${AUD[c.audience]||'—'}</td><td>${c.modules.reduce((a,m)=>a+m.l.length,0)}</td><td style="white-space:nowrap">${c.price?fmt(c.price):'<span class="pill g">Бесплатно</span>'}</td><td>${c.published?'<span class="pill g">Опубликован</span>':'<span class="pill">Черновик</span>'}</td><td><span class="btn ghost sm">Редактировать</span></td></tr>`).join('')}</table></div></div>`}

 return `<div class="col" style="gap:16px"><div class="row between"><div class="row"><a class="btn ghost sm" href="#courses">← Курсы</a><h1>${esc(e.title)}</h1></div><div class="row"><a class="btn ghost sm" href="/#course-${e.id}" target="_blank">Открыть на сайте ↗</a><button class="btn" data-act="saveCourse">Сохранить</button></div></div>

 </div>
 <div class="col" style="gap:16px">

   <label class="f">Студентов<input type="number" min="0" data-ec="students" value="${e.students}"></label>

/* ---------- lesson editor ---------- */
let EL=null;
const BT={text:'Текст',callout:'Выноска',code:'Код',quiz:'Квиз',formula:'Формула',diagram:'Схема (SVG)',sandbox:'Песочница'};
function lessonEditor(){const l=EL.lesson;
 return `<div class="row between"><h2>Контент урока <span class="mono muted">${esc(EL.id)}</span></h2><button class="btn ghost sm" data-act="closeLayer">✕</button></div>
 <label class="f" style="max-width:200px">Длительность, мин<input type="number" min="1" id="lMin" value="${l.min}"></label>
 ${l.blocks.map((b,i)=>`<div class="blk col"><div class="row between"><span class="pill b">${BT[b.t]||b.t}</span><span class="row" style="gap:4px"><button class="btn ghost sm" data-act="bUp" data-arg="${i}" ${i?'':'disabled'}>↑</button><button class="btn ghost sm" data-act="bDown" data-arg="${i}" ${i<l.blocks.length-1?'':'disabled'}>↓</button><button class="btn ghost sm" data-act="bDel" data-arg="${i}">✕</button></span></div>${blockForm(b,i)}</div>`).join('')||'<p class="muted small">Блоков пока нет</p>'}
 <div class="row">${['text','callout','code','quiz','formula'].map(t=>`<button class="btn ghost sm" data-act="bAdd" data-arg="${t}">+ ${BT[t]}</button>`).join('')}</div>
 <div class="row" style="position:sticky;bottom:-24px;background:var(--card);padding:12px 0"><button class="btn" data-act="saveLesson">Сохранить урок</button><span class="tiny muted">Текст поддерживает HTML: &lt;h2&gt;, &lt;p&gt;, &lt;b&gt;, &lt;ul&gt;&lt;li&gt;, &lt;table&gt;</span></div>`}
function blockForm(b,i){const F=(k,label,rows=3,mono)=>`<label class="f">${label}<textarea rows="${rows}" data-b="${i}|${k}" class="${mono?'mono':''}">${esc(b[k]||'')}</textarea></label>`;
 if(b.t==='text')return F('html','HTML',6,true);
 if(b.t==='callout')return `<div class="grid g2" style="gap:8px"><label class="f">Тип<select data-b="${i}|kind">${[['tip','Совет'],['important','Важно'],['error','Ошибка'],['example','Пример']].map(([v,l])=>`<option value="${v}" ${b.kind===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="f">Заголовок<input data-b="${i}|h" value="${esc(b.h)}"></label></div>${F('html','Текст',3)}`;
 if(b.t==='code')return `<label class="f">Язык / подпись<input data-b="${i}|lang" value="${esc(b.lang)}"></label>${F('code','Код',6,true)}`;
 if(b.t==='formula')return `<label class="f">Формула<input data-b="${i}|html" value="${esc(b.html)}"></label><label class="f">Подпись<input data-b="${i}|cap" value="${esc(b.cap)}"></label>`;
 if(b.t==='quiz')return `<label class="f">Вопрос<input data-b="${i}|q" value="${esc(b.q)}"></label><label class="chk"><input type="checkbox" data-b="${i}|req" ${b.req?'checked':''}> Обязательный для завершения урока</label>
  ${b.opts.map((o,k)=>`<div class="col" style="gap:4px;border-left:3px solid ${o.ok?'var(--green)':'var(--line)'};padding-left:10px"><div class="row" style="flex-wrap:nowrap"><input data-o="${i}|${k}|t" value="${esc(o.t)}" placeholder="Вариант ответа"><label class="chk"><input type="radio" name="ok${i}" data-o="${i}|${k}|ok" ${o.ok?'checked':''}>верный</label><button class="btn ghost sm" data-act="oDel" data-arg="${i}|${k}">✕</button></div><input data-o="${i}|${k}|why" value="${esc(o.why)}" placeholder="Пояснение после ответа" class="small"></div>`).join('')}
  <button class="btn ghost sm" style="width:fit-content" data-act="oAdd" data-arg="${i}">+ Вариант</button>`;
 if(b.t==='diagram')return `${F('svg','SVG-код',4,true)}<label class="f">Подпись<input data-b="${i}|cap" value="${esc(b.cap)}"></label>`;
 if(b.t==='sandbox')return `<p class="small muted">Интерактивная песочница с автопроверкой (задание «данные из договора»). Настраивается в коде.</p>`;
 return `<p class="small muted">Неизвестный тип блока</p>`}

/* ---------- router ---------- */
async function load(what){try{
 if(what==='dash'||what==='all')D.stats=await api('/stats');
 if(what==='leads')D.leads=(await api('/leads')).leads;
 if(what==='users'){D.users=(await api('/users')).users;if(!D.courses.length){const r=await api('/courses');D.courses=r.courses;D.lessonIds=r.lessonIds}}
 if(what==='orders')D.orders=(await api('/orders')).orders;
 if(what==='courses'){const r=await api('/courses');D.courses=r.courses;D.lessonIds=r.lessonIds}
 if(what==='pricing'){D.plans=(await api('/plans')).plans;D.promos=(await api('/promos')).promos}
 if(what==='settings')D.settings=(await api('/settings')).settings;
}catch(e){toast(e.message)}}
function page(){if(route==='dash')return pDash();if(route==='leads')return pLeads();if(route==='users')return pUsers();if(route==='orders')return pOrders();
 if(route==='courses')return pCourses();if(route.startsWith('courses/'))return pCourseEdit(route.slice(8));if(route==='pricing')return pPricing();if(route==='settings')return pSettings();return pDash()}
function render(){const app=document.getElementById('app');if(!TK){app.innerHTML=pLogin();return}app.innerHTML=shell(page())}
function rerenderMain(){const m=document.getElementById('main');if(m)m.innerHTML=page();else render()}
async function navigate(){route=location.hash.slice(1)||'dash';if(!TK){render();return}
 const base=route.split('/')[0];if(base!=='courses'||!route.includes('/'))EC=null;
 render();await load(base);if(base!=='dash')D.stats=D.stats||await api('/stats').catch(()=>null);render()}
addEventListener('hashchange',navigate);
setInterval(async()=>{if(!TK||document.hidden)return;if(route==='leads'||route==='dash'){const prev=D.stats?.leadsNew;await load('dash');if(route==='leads')await load('leads');if(!document.querySelector('.drawer')&&!document.activeElement?.matches('input,textarea,select'))render();if(prev!==undefined&&D.stats.leadsNew>prev)toast('Новая заявка!')}},30000);

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,arg=a.dataset.arg;
 if(a.tagName==='A')e.preventDefault();
 try{switch(act){
 case 'closeLayer':closeLayer();break;
 case 'logout':await api('/logout',{method:'POST'}).catch(()=>{});TK='';sessionStorage.removeItem(TOKEN_KEY);render();break;
 case 'reload':await load(route.split('/')[0]);await load('dash');render();toast('Обновлено');break;
 case 'csv':{const r=await fetch('/api/admin/leads.csv',{headers:{Authorization:'Bearer '+TK}});const b=await r.blob();const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='leads-'+new Date().toISOString().slice(0,10)+'.csv';l.click();URL.revokeObjectURL(u);break}
 case 'lf':{const[k,v]=arg.split('|');leadF[k]=v;rerenderMain();break}
 case 'openLead':if(!D.leads.length)await load('leads');openLead(arg);break;
 case 'leadStatus':{const[id,s]=arg.split('|');const r=await api('/leads/'+id,{method:'PATCH',body:{status:s}});Object.assign(D.leads.find(x=>x.id==id),r.lead);await load('dash');render();openLead(id);break}
 case 'leadNote':{const r=await api('/leads/'+arg,{method:'PATCH',body:{note:document.getElementById('leadNote').value}});Object.assign(D.leads.find(x=>x.id==arg),r.lead);toast('Заметка сохранена');break}
 case 'leadResend':{a.disabled=true;const r=await api('/leads/'+arg+'/resend',{method:'POST'});Object.assign(D.leads.find(x=>x.id==arg),r.lead);toast(r.lead.tg.ok?'Отправлено в Telegram':'Ошибка: '+r.lead.tg.error);openLead(arg);rerenderMain();break}
 case 'leadDel':if(!confirm('Удалить заявку без возможности восстановления?'))break;await api('/leads/'+arg,{method:'DELETE'});D.leads=D.leads.filter(x=>x.id!=arg);closeLayer();await load('dash');render();break;
 case 'openUser':openUser(arg);break;
 case 'userGrant':{const c=document.getElementById('grantC').value;if(!c)break;await api('/users/'+arg,{method:'PATCH',body:{grantCourse:c}});await load('users');openUser(arg);rerenderMain();toast('Курс выдан');break}
 case 'userRevoke':{const[id,c]=arg.split('|');await api('/users/'+id,{method:'PATCH',body:{revokeCourse:c}});await load('users');openUser(id);rerenderMain();break}
 case 'userSub':{const[id,m]=arg.split('|');await api('/users/'+id,{method:'PATCH',body:{subMonths:Number(m)}});await load('users');openUser(id);rerenderMain();toast('Подписка выдана');break}
 case 'userSubOff':await api('/users/'+arg,{method:'PATCH',body:{revokeSub:true}});await load('users');openUser(arg);rerenderMain();break;
 case 'refund':if(!confirm('Оформить возврат? Доступ будет отозван.'))break;await api('/orders/'+arg+'/refund',{method:'POST'});await load('orders');rerenderMain();toast('Возврат оформлен');break;
 case 'goCourse':location.hash='courses/'+arg;break;
 case 'newCourse':{const id=prompt('ID курса латиницей (будет в адресе страницы), например: excel-ai');if(!id)break;const r=await api('/courses',{method:'POST',body:{id}});D.courses.push(r.course);location.hash='courses/'+r.course.id;break}
 case 'saveCourse':{const r=await api('/courses/'+EC.id,{method:'PUT',body:EC});Object.assign(D.courses.find(x=>x.id===EC.id),r.course);EC=JSON.parse(JSON.stringify(r.course));toast('Курс сохранён');rerenderMain();break}
 case 'delCourse':if(!confirm('Удалить курс «'+EC.title+'»? Это действие нельзя отменить.'))break;await api('/courses/'+EC.id,{method:'DELETE'});D.courses=D.courses.filter(x=>x.id!==EC.id);EC=null;location.hash='courses';break;
 case 'addMod':EC.modules.push({t:'Новый модуль',l:[]});rerenderMain();break;
 case 'delMod':if(EC.modules[arg].l.length&&!confirm('Удалить модуль вместе с уроками?'))break;EC.modules.splice(arg,1);rerenderMain();break;
 case 'addLes':EC.modules[arg].l.push({id:EC.id+'-'+Math.random().toString(36).slice(2,6),t:'Новый урок',free:false});rerenderMain();break;
 case 'delLes':{const[m,l]=arg.split('|');EC.modules[m].l.splice(l,1);rerenderMain();break}
 case 'editLesson':{const r=await api('/lessons/'+encodeURIComponent(arg));EL={id:arg,lesson:r.lesson};drawer(lessonEditor());document.querySelector('.drawer').style.width='min(760px,100%)';break}
 case 'bAdd':{const T={text:{t:'text',html:'<p>Новый абзац</p>'},callout:{t:'callout',kind:'tip',h:'Совет',html:''},code:{t:'code',lang:'Промпт',code:''},quiz:{t:'quiz',id:'q-'+Math.random().toString(36).slice(2,8),req:true,q:'',opts:[{t:'',ok:true,why:''},{t:'',ok:false,why:''}]},formula:{t:'formula',html:'',cap:''}};EL.lesson.blocks.push(T[arg]);redrawLesson();break}
 case 'bDel':if(!confirm('Удалить блок?'))break;EL.lesson.blocks.splice(arg,1);redrawLesson();break;
 case 'bUp':case 'bDown':{const i=Number(arg),j=act==='bUp'?i-1:i+1;const B=EL.lesson.blocks;[B[i],B[j]]=[B[j],B[i]];redrawLesson();break}
 case 'oAdd':EL.lesson.blocks[arg].opts.push({t:'',ok:false,why:''});redrawLesson();break;
 case 'oDel':{const[i,k]=arg.split('|');EL.lesson.blocks[i].opts.splice(k,1);redrawLesson();break}
 case 'saveLesson':{EL.lesson.min=Number(document.getElementById('lMin').value)||10;await api('/lessons/'+encodeURIComponent(EL.id),{method:'PUT',body:{lesson:EL.lesson}});if(!D.lessonIds.includes(EL.id))D.lessonIds.push(EL.id);toast('Урок сохранён');closeLayer();rerenderMain();break}
 case 'savePlans':{const r=await api('/plans',{method:'PUT',body:{plans:D.plans}});D.plans=r.plans;toast('Тарифы сохранены');rerenderMain();break}
 case 'promoToggle':{const p=D.promos.find(x=>x.code===arg);await api('/promos/'+encodeURIComponent(arg),{method:'PATCH',body:{active:!p.active}});p.active=!p.active;rerenderMain();break}
 case 'promoDel':if(!confirm('Удалить промокод '+arg+'?'))break;await api('/promos/'+encodeURIComponent(arg),{method:'DELETE'});D.promos=D.promos.filter(x=>x.code!==arg);rerenderMain();break;
 case 'tgTest':{a.disabled=true;const r=await api('/settings/test-telegram',{method:'POST'});a.disabled=false;toast(r.ok?'Тестовое сообщение отправлено в группу':'Ошибка: '+r.error);await load('settings');break}
 }}catch(er){toast(er.message);a.disabled=false}});
function redrawLesson(){const d=document.querySelector('.drawer');const y=d.scrollTop;d.innerHTML=lessonEditor();d.scrollTop=y}
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.input==='lq'){leadF.q=el.value;document.getElementById('leadTable').innerHTML=leadTable(leadsFiltered())}
 if(el.dataset.input==='uq'){userQ=el.value;const v=el.value;rerenderMain();const i=document.querySelector('[data-input=uq]');i.focus();i.setSelectionRange(v.length,v.length)}
 if(el.dataset.ec){const k=el.dataset.ec;EC[k]=el.type==='checkbox'?el.checked:k==='outcomes'?el.value.split('\n').map(s=>s.trim()).filter(Boolean):el.type==='number'?Number(el.value):el.value;if(k==='cover')document.getElementById('covPrev').style.background=COVERS[el.value]}
 if(el.dataset.mod!==undefined)EC.modules[el.dataset.mod].t=el.value;
 if(el.dataset.les){const[m,l,k]=el.dataset.les.split('|');EC.modules[m].l[l][k]=el.type==='checkbox'?el.checked:el.value}
 if(el.dataset.b){const[i,k]=el.dataset.b.split('|');EL.lesson.blocks[i][k]=el.type==='checkbox'?el.checked:el.value}
 if(el.dataset.o){const[i,k,f]=el.dataset.o.split('|');const opts=EL.lesson.blocks[i].opts;if(f==='ok'){opts.forEach((o,n)=>o.ok=n==k);redrawLesson()}else opts[k][f]=el.value}
 if(el.dataset.plan){const[i,k]=el.dataset.plan.split('|');if(k==='best')D.plans.forEach((p,n)=>p.best=n==i);else D.plans[i][k]=Number(el.value)}
});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.change==='lftype'){leadF.type=el.value;rerenderMain()}
 if(el.dataset.ec&&(el.type==='checkbox'||el.tagName==='SELECT'))el.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('submit',async e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());
 try{
 if(k==='login'){const r=await api('/login',{method:'POST',body:fd});TK=r.token;sessionStorage.setItem(TOKEN_KEY,TK);await navigate()}
 if(k==='promo'){const r=await api('/promos',{method:'POST',body:fd});D.promos.push(r.promo);toast('Промокод создан');rerenderMain()}
 if(k==='settings'){const body={...fd};f.querySelectorAll('input[type=checkbox]').forEach(c=>body[c.name]=c.checked);const r=await api('/settings',{method:'PUT',body});D.settings=r.settings;toast('Настройки сохранены');rerenderMain()}
 }catch(er){toast(er.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
navigate();
</script>
</body>
</html>
