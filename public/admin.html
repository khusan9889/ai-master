<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Админ-панель — AI Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F3;--bg2:#EDECE8;--card:#fff;--ink:#111318;--ink2:#3B3E47;--muted:#71717A;--line:#E5E3DE;--brand:#FF6B1A;--brand-ink:#B8490A;--brand-soft:#FFF1E8;--blue:#3347C9;--blue-soft:#EDF0FF;--green:#15803D;--green-soft:#E7F6EC;--red:#C2410C;--red-soft:#FDECE3;--amber:#A16207;--amber-soft:#FEF6DA;--sh:0 1px 2px rgba(17,19,24,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0D0F14;--bg2:#181B22;--card:#15181F;--ink:#F2F1EE;--ink2:#C9C8C3;--muted:#8E8D88;--line:#262A33;--brand-ink:#FF9A5C;--brand-soft:#2B1D15;--blue:#8F9DFF;--blue-soft:#1A1F3A;--green:#4ADE80;--green-soft:#11251A;--red:#FB8A5C;--red-soft:#2E1A12;--amber:#F5C451;--amber-soft:#2E2610}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14.5px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}a{color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.2}
h1{font-size:26px}h2{font-size:19px}h3{font-size:15.5px}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1200px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;background:var(--brand);color:#111318;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--bg2)}
.btn.danger{background:var(--red-soft);color:var(--red)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg2);color:var(--ink2);white-space:nowrap}
.pill.o{background:var(--brand-soft);color:var(--brand-ink)}.pill.g{background:var(--green-soft);color:var(--green)}.pill.b{background:var(--blue-soft);color:var(--blue)}.pill.r{background:var(--red-soft);color:var(--red)}.pill.y{background:var(--amber-soft);color:var(--amber)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static!important;height:auto!important;flex-direction:row!important;overflow:auto}.side .brand,.side .foot{display:none}.side a{white-space:nowrap}}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;font-family:Manrope;font-weight:800;font-size:16px;padding:4px 8px 18px}
.side a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500}
.side a:hover{background:var(--bg2)}.side a.on{background:var(--bg2);color:var(--ink);font-weight:600}
.side .cnt{background:var(--brand);color:#111318;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:800}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
main{padding:28px;min-width:0;max-width:1400px}
@media(max-width:600px){main{padding:16px}}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-family:Manrope;font-weight:800;font-size:28px;letter-spacing:-.02em;margin-top:2px}
.big .v{font-size:44px}
.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--bg)}
.tablewrap{overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:6px 13px;font-weight:500;font-size:13.5px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:50}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--card);z-index:51;overflow:auto;padding:24px;box-shadow:-20px 0 60px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:100;font-weight:600;font-size:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink2)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:auto;accent-color:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:3px;height:180px;padding-top:18px}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0;position:relative}
.chart .b i{display:block;width:100%;max-width:38px;background:var(--brand);border-radius:5px 5px 2px 2px;min-height:2px}
.chart .b .v{font-size:11px;color:var(--ink2);font-weight:600}
.chart .b .d{font-size:10.5px;color:var(--muted);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;font-size:13.5px}
.hbar .track{grid-column:1/-1;height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:6px}
.hbar .track i{display:block;height:100%;background:var(--ink);border-radius:99px}
.funnel .st{display:grid;grid-template-columns:minmax(0,1fr) 70px 56px;gap:4px 12px;align-items:center;padding:6px 0}
.funnel .lb{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.funnel .bar{height:10px;background:var(--bg2);border-radius:99px;position:relative;overflow:hidden}
.funnel .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.blk{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.hint{background:var(--blue-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
const TOKEN_KEY='aimaster_admin';
let TK=sessionStorage.getItem(TOKEN_KEY)||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU').replace(/ |,/g,' ')+' сум';
const num=n=>Number(n||0).toLocaleString('ru-RU').replace(/ |,/g,' ');
const dt=s=>s?new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const dur=s=>{s=Math.round(s||0);return s<60?s+' с':Math.floor(s/60)+' мин '+String(s%60).padStart(2,'0')+' с'};
const LOGO=s=>`<svg width="${s}" height="${s}" viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="#FF6B1A"/><path d="M32 42 L56 62 L32 82" fill="none" stroke="#111318" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M64 84 H86" stroke="#111318" stroke-width="12" stroke-linecap="round"/></svg>`;
function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
async function api(p,{method='GET',body}={}){const r=await fetch('/api/admin'+p,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TK},body:body?JSON.stringify(body):undefined});
 const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='/login'){TK='';sessionStorage.removeItem(TOKEN_KEY);render();throw new Error(j.error||'Нужно войти')}if(!r.ok)throw new Error(j.error||'Ошибка '+r.status);return j}
const LEAD_ST={new:['Новая','o'],work:['В работе','b'],done:['Успешно','g'],rejected:['Отказ','']};
const TYPES={plan:'Подписка',buy:'Покупка курса',consult:'Консультация',business:'Компания'};
let D={an:null,leads:[],courses:[],lessonIds:[],plans:[],settings:null,leadsNew:0};
let route='analytics',leadF={status:'',type:'',q:''};
const tkDay=t=>new Date(t+5*3600e3).toISOString().slice(0,10);
let range={preset:'7',from:tkDay(Date.now()-6*864e5),to:tkDay(Date.now())},metric='visitors';

function closeLayer(){document.getElementById('layer').innerHTML=''}
function drawer(html){document.getElementById('layer').innerHTML=`<div class="drawer-bg" data-act="closeLayer"></div><div class="drawer">${html}</div>`}

/* ---------- login / layout ---------- */
function pLogin(){return `<div class="login"><form class="card col" style="width:100%;max-width:360px;gap:16px;padding:28px" data-submit="login">
 <div class="brand" style="padding:0">${LOGO(32)}<span>AI Master · админ</span></div>
 <label class="f">Логин<input name="login" autocomplete="username" required></label><label class="f">Пароль<input name="password" type="password" autocomplete="current-password" required></label>
 <button class="btn" style="padding:12px">Войти</button></form></div>`}
function shell(body){const items=[['analytics','Аналитика'],['leads','Заявки',D.leadsNew],['courses','Курсы'],['plans','Тарифы'],['settings','Настройки']];
 return `<div class="layout"><nav class="side"><div class="brand">${LOGO(28)}<span>AI Master</span></div>
 ${items.map(([k,l,n])=>`<a href="#${k}" class="${route===k||route.startsWith(k+'/')?'on':''}"><span>${l}</span>${n?`<span class="cnt">${n}</span>`:''}</a>`).join('')}
 <div class="foot"><a href="/" target="_blank">Открыть сайт ↗</a><a href="#" data-act="logout">Выйти</a></div></nav><main id="main">${body}</main></div>`}

/* ---------- analytics ---------- */
const hbars=(arr,lbl=x=>x.k)=>{if(!arr||!arr.length)return '<p class="muted small">Нет данных</p>';const m=Math.max(...arr.map(x=>x.n));return `<div class="hbar">${arr.map(x=>`<span>${esc(lbl(x))}</span><b>${num(x.n)}</b><div class="track"><i style="width:${x.n/m*100}%"></i></div>`).join('')}</div>`};
function ctaCard(c,title){if(!c)return '';return `<div class="card col" style="gap:14px"><div class="row between"><h2>«${title}»</h2><span class="pill o">клики</span></div>
 <div class="row" style="gap:28px;align-items:flex-end"><div class="kpi big"><div class="v">${num(c.clicks)}</div><div class="l">нажатий</div></div><div class="kpi"><div class="v">${num(c.uniq)}</div><div class="l">разных людей</div></div></div>
 <div class="grid g2" style="gap:20px"><div class="col"><b class="small">По ${title==='Купить курс'?'курсам':'тарифам'}</b>${hbars(c.byItem)}</div><div class="col"><b class="small">Где нажимали</b>${hbars(c.byPlace)}</div></div></div>`}
function pAnalytics(){const a=D.an;
 const head=`<div class="row between"><div class="row" style="gap:16px"><h1>Аналитика</h1>${a?`<span class="live"><i></i>Сейчас на сайте: ${a.online}</span>`:''}</div>
 <div class="row"><div class="tabs">${[['0','Сегодня'],['1','Вчера'],['7','7 дней'],['30','30 дней'],['90','90 дней']].map(([k,l])=>`<button class="${range.preset===k?'on':''}" data-act="range" data-arg="${k}">${l}</button>`).join('')}</div>
 <input type="date" value="${range.from}" data-range="from" style="width:auto"><span class="muted">—</span><input type="date" value="${range.to}" data-range="to" style="width:auto"><button class="btn ghost sm" data-act="reload">Обновить</button></div></div>`;
 if(!a)return head+'<div class="empty">Загрузка…</div>';
 const k=a.kpi;const C=id=>a.cta.find(x=>x.id===id);
 const series=a.series;const M={visitors:'Посетители',pageviews:'Просмотры',leads:'Заявки',subscribe:'«Оформить подписку»',buy:'«Купить курс»'};
 const mx=Math.max(1,...series.map(d=>d[metric]));const showEvery=Math.ceil(series.length/16);
 const f0=a.funnel[0].n||1;
 const others=a.cta.filter(x=>!['subscribe','buy_course'].includes(x.id)&&x.clicks);
 return `<div class="col" style="gap:16px">${head}
 <div class="grid g6">${[['Посетители',num(k.visitors)],['Визиты',num(k.sessions)],['Просмотры страниц',num(k.pageviews)],['Заявки',num(k.leads)],['Конверсия в заявку',k.conv+'%'],['Время на сайте',dur(k.avgDuration)]].map(x=>`<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>
 <div class="grid g2">${ctaCard(C('subscribe'),'Оформить подписку')}${ctaCard(C('buy_course'),'Купить курс')}</div>
 <div class="card col"><div class="row between"><h2>По дням</h2><div class="tabs">${Object.entries(M).map(([id,l])=>`<button class="${metric===id?'on':''}" data-act="metric" data-arg="${id}">${l}</button>`).join('')}</div></div>
  <div class="chart">${series.map((d,i)=>`<div class="b" title="${d.day}: ${d[metric]}"><span class="v">${d[metric]||''}</span><i style="height:${d[metric]/mx*80}%"></i><span class="d">${i%showEvery===0?d.day.slice(8)+'.'+d.day.slice(5,7):'&nbsp;'}</span></div>`).join('')}</div></div>
 <div class="grid g2">
  <div class="card col"><h2>Воронка</h2><div class="funnel">${a.funnel.map((s,i)=>`<div class="st"><span class="lb">${i+1}. ${esc(s.label)}</span><div class="bar"><i style="width:${Math.max(1,s.n/f0*100)}%"></i></div><b style="text-align:right">${num(s.n)}</b><span class="small muted" style="text-align:right">${i?Math.round(s.n/(a.funnel[i-1].n||1)*100)+'%':'100%'}</span></div>`).join('')}</div>
   <p class="tiny muted">Справа — какая доля перешла с предыдущего шага.</p></div>
  <div class="card col"><h2>Остальные кнопки</h2>${others.length?`<table class="t"><tr><th>Кнопка</th><th class="n">Нажатий</th><th class="n">Людей</th></tr>${others.map(x=>`<tr><td>${esc(x.label)}</td><td class="n">${num(x.clicks)}</td><td class="n">${num(x.uniq)}</td></tr>`).join('')}</table>`:'<p class="muted small">Нет данных</p>'}
   <h2 style="margin-top:8px">Заявки по типам</h2>${hbars(a.leadsByType,x=>TYPES[x.k]||x.k)}</div>
 </div>
 <div class="card col"><h2>Источники трафика</h2><div class="tablewrap">${a.sources.length?`<table class="t"><tr><th>Источник</th><th class="n">Визиты</th><th class="n">Посетители</th><th class="n">Нажали «купить»</th><th class="n">Заявки</th><th class="n">Конверсия</th></tr>${a.sources.map(s=>`<tr><td><b>${esc(s.src)}</b></td><td class="n">${num(s.sessions)}</td><td class="n">${num(s.visitors)}</td><td class="n">${num(s.cta)}</td><td class="n">${num(s.leads)}</td><td class="n">${s.conv}%</td></tr>`).join('')}</table>`:'<p class="muted small">Нет данных</p>'}</div></div>
 <div class="card col"><h2>Рекламные кампании (UTM)</h2>${a.campaigns.length?`<div class="tablewrap"><table class="t"><tr><th>Источник / канал</th><th>Кампания</th><th>Объявление</th><th class="n">Визиты</th><th class="n">Нажали «купить»</th><th class="n">Заявки</th><th class="n">Конверсия</th></tr>${a.campaigns.map(c=>`<tr><td>${esc(c.src)} / ${esc(c.med)}</td><td><b>${esc(c.cmp)}</b></td><td class="muted">${esc(c.cnt||'—')}</td><td class="n">${num(c.sessions)}</td><td class="n">${num(c.cta)}</td><td class="n">${num(c.leads)}</td><td class="n">${c.conv}%</td></tr>`).join('')}</table></div>`:''}
  <div class="hint">Чтобы видеть результаты каждого объявления, добавляйте к ссылке метки, например:<br><span class="mono">${esc(location.origin)}/?utm_source=instagram&amp;utm_medium=cpc&amp;utm_campaign=test1&amp;utm_content=video_a</span><br>Переходы из Facebook, Instagram и Google Ads без меток тоже распознаются автоматически.</div></div>
 <div class="grid g2">
  <div class="card col"><h2>Популярные страницы</h2>${a.pages.length?`<table class="t"><tr><th>Страница</th><th class="n">Просмотры</th><th class="n">Посетители</th></tr>${a.pages.map(p=>`<tr><td>${esc(p.label)}</td><td class="n">${num(p.views)}</td><td class="n">${num(p.visitors)}</td></tr>`).join('')}</table>`:'<p class="muted small">Нет данных</p>'}</div>
  <div class="card col"><h2>Открывали пробные уроки</h2>${hbars(a.lessons)}<p class="tiny muted">Отказы: ${k.bounce}% — ушли, ничего не сделав, за 10 секунд.</p></div>
 </div>
 <div class="grid g3"><div class="card col"><h2>Устройства</h2>${hbars(a.devices)}</div><div class="card col"><h2>Браузеры</h2>${hbars(a.browsers)}</div><div class="card col"><h2>Системы</h2>${hbars(a.os)}</div></div>
 </div>`}

/* ---------- leads ---------- */
function leadsFiltered(){const q=leadF.q.toLowerCase();return D.leads.filter(l=>(!leadF.status||l.status===leadF.status)&&(!leadF.type||l.type===leadF.type)&&(!q||(l.name+l.phone+(l.company||'')+(l.message||'')+(l.item||'')).toLowerCase().includes(q)))}
function pLeads(){return `<div class="col" style="gap:16px"><div class="row between"><h1>Заявки</h1><div class="row"><button class="btn ghost sm" data-act="reload">Обновить</button><button class="btn ghost sm" data-act="csv">Скачать CSV</button></div></div>
 <div class="row"><div class="tabs">${[['','Все'],...Object.entries(LEAD_ST).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="${leadF.status===k?'on':''}" data-act="lf" data-arg="status|${k}">${l} <span class="muted">${k?D.leads.filter(x=>x.status===k).length:D.leads.length}</span></button>`).join('')}</div>
 <select style="width:auto" data-change="lftype"><option value="">Все типы</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${leadF.type===k?'selected':''}>${v}</option>`).join('')}</select>
 <input style="max-width:260px" placeholder="Поиск" value="${esc(leadF.q)}" data-input="lq"></div>
 <div class="card tablewrap" style="padding:6px 10px" id="leadTable">${leadTable(leadsFiltered())}</div></div>`}

function openLead(id){const l=D.leads.find(x=>x.id===Number(id));if(!l)return;
 drawer(`<div class="row between"><h2>Заявка #${l.id}</h2><button class="btn ghost sm" data-act="closeLayer">✕</button></div>
 <div class="row"><span class="pill">${TYPES[l.type]||esc(l.type)}</span><span class="tiny muted">${dt(l.createdAt)}</span></div>
 <dl class="kv"><dt>Имя</dt><dd><b>${esc(l.name)}</b></dd><dt>Телефон</dt><dd><a href="tel:${esc(l.phone.replace(/\s/g,''))}">${esc(l.phone)}</a></dd>
 ${l.item?`<dt>Выбор</dt><dd>${esc(l.item)}</dd>`:''}${l.company?`<dt>Компания</dt><dd>${esc(l.company)}</dd>`:''}${l.size?`<dt>Сотрудников</dt><dd>${esc(l.size)}</dd>`:''}${l.message?`<dt>Комментарий</dt><dd>${esc(l.message)}</dd>`:''}
 <dt>Источник</dt><dd>${esc([l.src,l.med].filter(Boolean).join(' / ')||'прямой заход')}</dd>${l.cmp?`<dt>Кампания</dt><dd>${esc(l.cmp)}${l.cnt?' · '+esc(l.cnt):''}</dd>`:''}<dt>Устройство</dt><dd>${esc(l.device||'—')}</dd><dt>Страница</dt><dd>${esc(l.page||'—')}</dd>
 <dt>Telegram</dt><dd>${l.tg?.ok?'<span class="pill g">Отправлено</span>':`<span class="pill r">Не отправлено</span> <span class="tiny muted">${esc(l.tg?.error||'')}</span>`}</dd></dl>
 <div class="col"><b class="small">Статус</b><div class="tabs">${Object.entries(LEAD_ST).map(([k,v])=>`<button class="${l.status===k?'on':''}" data-act="leadStatus" data-arg="${l.id}|${k}">${v[0]}</button>`).join('')}</div></div>
 <label class="f">Заметка менеджера<textarea id="leadNote" rows="4" placeholder="Итог звонка, договорённости…">${esc(l.note)}</textarea></label>
 <div class="row"><button class="btn" data-act="leadNote" data-arg="${l.id}">Сохранить заметку</button><button class="btn ghost" data-act="leadResend" data-arg="${l.id}">Отправить в Telegram ещё раз</button></div>
 <div style="margin-top:auto"><button class="btn danger sm" data-act="leadDel" data-arg="${l.id}">Удалить заявку</button></div>`)}

   <label class="f">Тема<input data-ec="topic" value="${esc(e.topic)}"></label><label class="f">Часов<input type="number" min="0" data-ec="hours" value="${e.hours}"></label>
   <label class="f">Порядок<input type="number" min="0" data-ec="order" value="${e.order}"></label><label class="f">Популярность<input type="number" min="0" data-ec="students" value="${e.students}"></label>
   <label class="f">Цвет обложки${sel('cover',Object.keys(COVERS).map(k=>[k,k.toUpperCase()]))}</label><label class="f">Иконка${sel('icon',Object.entries(ICONS))}</label></div>
   <div style="height:56px;border-radius:12px;background:${grad(e.cover)}" id="covPrev"></div><p class="tiny muted">«Популярность» влияет на порядок в блоке «Популярные курсы».</p></div>

 </div></div></div>`}
let EL=null;
const BT={text:'Текст',callout:'Выноска',code:'Код',quiz:'Вопрос',formula:'Формула',diagram:'Схема (SVG)',sandbox:'Песочница'};
function lessonEditor(){const l=EL.lesson;return `<div class="row between"><h2>Контент урока <span class="mono muted">${esc(EL.id)}</span></h2><button class="btn ghost sm" data-act="closeLayer">✕</button></div>
 <label class="f" style="max-width:200px">Длительность, мин<input type="number" min="1" id="lMin" value="${l.min}"></label>
 ${l.blocks.map((b,i)=>`<div class="blk col"><div class="row between"><span class="pill b">${BT[b.t]||b.t}</span><span class="row" style="gap:4px"><button class="btn ghost sm" data-act="bUp" data-arg="${i}" ${i?'':'disabled'}>↑</button><button class="btn ghost sm" data-act="bDown" data-arg="${i}" ${i<l.blocks.length-1?'':'disabled'}>↓</button><button class="btn ghost sm" data-act="bDel" data-arg="${i}">✕</button></span></div>${blockForm(b,i)}</div>`).join('')||'<p class="muted small">Блоков пока нет</p>'}

function blockForm(b,i){const F=(k,label,rows=3,mono)=>`<label class="f">${label}<textarea rows="${rows}" data-b="${i}|${k}" class="${mono?'mono':''}">${esc(b[k]||'')}</textarea></label>`;
 if(b.t==='text')return F('html','HTML',6,true);
 if(b.t==='callout')return `<div class="grid g2" style="gap:8px"><label class="f">Тип<select data-b="${i}|kind">${[['tip','Совет'],['important','Важно'],['error','Ошибка'],['example','Пример']].map(([v,l])=>`<option value="${v}" ${b.kind===v?'selected':''}>${l}</option>`).join('')}</select></label><label class="f">Заголовок<input data-b="${i}|h" value="${esc(b.h)}"></label></div>${F('html','Текст',3)}`;
 if(b.t==='code')return `<label class="f">Подпись<input data-b="${i}|lang" value="${esc(b.lang)}"></label>${F('code','Код',6,true)}`;
 if(b.t==='formula')return `<label class="f">Формула<input data-b="${i}|html" value="${esc(b.html)}"></label><label class="f">Подпись<input data-b="${i}|cap" value="${esc(b.cap)}"></label>`;
 if(b.t==='quiz')return `<label class="f">Вопрос<input data-b="${i}|q" value="${esc(b.q)}"></label><label class="chk"><input type="checkbox" data-b="${i}|req" ${b.req?'checked':''}> Обязателен для перехода дальше</label>
  ${b.opts.map((o,k)=>`<div class="col" style="gap:4px;border-left:3px solid ${o.ok?'var(--green)':'var(--line)'};padding-left:10px"><div class="row" style="flex-wrap:nowrap"><input data-o="${i}|${k}|t" value="${esc(o.t)}" placeholder="Вариант ответа"><label class="chk"><input type="radio" name="ok${i}" data-o="${i}|${k}|ok" ${o.ok?'checked':''}>верный</label><button class="btn ghost sm" data-act="oDel" data-arg="${i}|${k}">✕</button></div><input data-o="${i}|${k}|why" value="${esc(o.why)}" placeholder="Пояснение после ответа"></div>`).join('')}
  <button class="btn ghost sm" style="width:fit-content" data-act="oAdd" data-arg="${i}">+ Вариант</button>`;
 if(b.t==='diagram')return `${F('svg','SVG-код',4,true)}<label class="f">Подпись<input data-b="${i}|cap" value="${esc(b.cap)}"></label>`;
 if(b.t==='sandbox')return `<p class="small muted">Интерактивная песочница с автопроверкой. Настраивается в коде.</p>`;
 return ''}

 return `<div class="col" style="gap:16px;max-width:860px"><h1>Настройки</h1>

 <form class="card col" data-submit="settings" style="gap:14px"><h2>Пиксели рекламных систем</h2>

/* ---------- router ---------- */
async function load(what){try{
 if(what==='analytics')D.an=await api(`/analytics?from=${range.from}&to=${range.to}`);
 if(what==='leads')D.leads=(await api('/leads')).leads;
 if(what==='courses'){const r=await api('/courses');D.courses=r.courses;D.lessonIds=r.lessonIds}
 if(what==='plans')D.plans=(await api('/plans')).plans;
 if(what==='settings')D.settings=(await api('/settings')).settings;
 D.leadsNew=(await api('/summary')).leadsNew;
}catch(e){toast(e.message)}}
function page(){if(route==='leads')return pLeads();if(route==='courses')return pCourses();if(route.startsWith('courses/'))return pCourseEdit(route.slice(8));if(route==='plans')return pPlans();if(route==='settings')return pSettings();return pAnalytics()}
function render(){const app=document.getElementById('app');if(!TK){app.innerHTML=pLogin();return}app.innerHTML=shell(page())}
function rerenderMain(){const m=document.getElementById('main');if(m)m.innerHTML=page();else render()}
async function navigate(){route=location.hash.slice(1)||'analytics';if(!TK){render();return}const base=route.split('/')[0];if(!route.includes('/'))EC=null;render();await load(base);render()}
addEventListener('hashchange',navigate);
setInterval(async()=>{if(!TK||document.hidden||document.querySelector('.drawer')||document.activeElement?.matches('input,textarea,select'))return;
 const prev=D.leadsNew;if(route==='analytics'||route==='leads'){await load(route);render()}else{await load('none');}if(D.leadsNew>prev)toast('Новая заявка!')},30000);
function setPreset(k){const n=Date.now();range.preset=k;if(k==='1'){range.from=range.to=tkDay(n-864e5)}else{range.to=tkDay(n);range.from=tkDay(n-Math.max(0,Number(k)-1)*864e5)}}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,arg=a.dataset.arg;if(a.tagName==='A')e.preventDefault();
 try{switch(act){
 case 'closeLayer':closeLayer();break;
 case 'logout':await api('/logout',{method:'POST'}).catch(()=>{});TK='';sessionStorage.removeItem(TOKEN_KEY);render();break;
 case 'reload':await load(route.split('/')[0]);render();toast('Обновлено');break;
 case 'range':setPreset(arg);D.an=null;rerenderMain();await load('analytics');render();break;
 case 'metric':metric=arg;rerenderMain();break;
 case 'csv':{const r=await fetch('/api/admin/leads.csv',{headers:{Authorization:'Bearer '+TK}});const b=await r.blob();const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='leads-'+tkDay(Date.now())+'.csv';l.click();URL.revokeObjectURL(u);break}
 case 'lf':{const[k,v]=arg.split('|');leadF[k]=v;rerenderMain();break}
 case 'openLead':openLead(arg);break;
 case 'leadStatus':{const[id,s]=arg.split('|');const r=await api('/leads/'+id,{method:'PATCH',body:{status:s}});Object.assign(D.leads.find(x=>x.id==id),r.lead);await load('none');render();openLead(id);break}
 case 'leadNote':{const r=await api('/leads/'+arg,{method:'PATCH',body:{note:document.getElementById('leadNote').value}});Object.assign(D.leads.find(x=>x.id==arg),r.lead);toast('Заметка сохранена');break}
 case 'leadResend':{a.disabled=true;const r=await api('/leads/'+arg+'/resend',{method:'POST'});Object.assign(D.leads.find(x=>x.id==arg),r.lead);toast(r.lead.tg.ok?'Отправлено в Telegram':'Ошибка: '+r.lead.tg.error);openLead(arg);rerenderMain();break}
 case 'leadDel':if(!confirm('Удалить заявку без возможности восстановления?'))break;await api('/leads/'+arg,{method:'DELETE'});D.leads=D.leads.filter(x=>x.id!=arg);closeLayer();await load('none');render();break;
 case 'goCourse':location.hash='courses/'+arg;break;
 case 'newCourse':{const id=prompt('ID курса латиницей (будет в адресе страницы), например: excel-ai');if(!id)break;const r=await api('/courses',{method:'POST',body:{id}});D.courses.push(r.course);location.hash='courses/'+r.course.id;break}
 case 'saveCourse':{const r=await api('/courses/'+EC.id,{method:'PUT',body:EC});Object.assign(D.courses.find(x=>x.id===EC.id),r.course);EC=JSON.parse(JSON.stringify(r.course));toast('Курс сохранён');rerenderMain();break}
 case 'delCourse':if(!confirm('Удалить курс «'+EC.title+'»?'))break;await api('/courses/'+EC.id,{method:'DELETE'});D.courses=D.courses.filter(x=>x.id!==EC.id);EC=null;location.hash='courses';break;
 case 'addMod':EC.modules.push({t:'Новый модуль',l:[]});rerenderMain();break;
 case 'delMod':if(EC.modules[arg].l.length&&!confirm('Удалить модуль вместе с уроками?'))break;EC.modules.splice(arg,1);rerenderMain();break;
 case 'addLes':EC.modules[arg].l.push({id:EC.id+'-'+Math.random().toString(36).slice(2,6),t:'Новый урок',free:false});rerenderMain();break;
 case 'delLes':{const[m,l]=arg.split('|');EC.modules[m].l.splice(l,1);rerenderMain();break}
 case 'editLesson':{const r=await api('/lessons/'+encodeURIComponent(arg));EL={id:arg,lesson:r.lesson};drawer(lessonEditor());document.querySelector('.drawer').style.width='min(760px,100%)';break}
 case 'bAdd':{const N={text:{t:'text',html:'<p>Новый абзац</p>'},callout:{t:'callout',kind:'tip',h:'Совет',html:''},code:{t:'code',lang:'Промпт',code:''},quiz:{t:'quiz',id:'q-'+Math.random().toString(36).slice(2,8),req:true,q:'',opts:[{t:'',ok:true,why:''},{t:'',ok:false,why:''}]},formula:{t:'formula',html:'',cap:''}};EL.lesson.blocks.push(N[arg]);redrawLesson();break}
 case 'bDel':if(!confirm('Удалить блок?'))break;EL.lesson.blocks.splice(arg,1);redrawLesson();break;
 case 'bUp':case 'bDown':{const i=Number(arg),j=act==='bUp'?i-1:i+1;const B=EL.lesson.blocks;[B[i],B[j]]=[B[j],B[i]];redrawLesson();break}
 case 'oAdd':EL.lesson.blocks[arg].opts.push({t:'',ok:false,why:''});redrawLesson();break;
 case 'oDel':{const[i,k]=arg.split('|');EL.lesson.blocks[i].opts.splice(k,1);redrawLesson();break}
 case 'saveLesson':{EL.lesson.min=Number(document.getElementById('lMin').value)||10;await api('/lessons/'+encodeURIComponent(EL.id),{method:'PUT',body:{lesson:EL.lesson}});if(!D.lessonIds.includes(EL.id))D.lessonIds.push(EL.id);toast('Урок сохранён');closeLayer();rerenderMain();break}
 case 'savePlans':{const r=await api('/plans',{method:'PUT',body:{plans:D.plans}});D.plans=r.plans;toast('Тарифы сохранены');rerenderMain();break}
 case 'tgTest':{a.disabled=true;const r=await api('/settings/test-telegram',{method:'POST'});a.disabled=false;toast(r.ok?'Тестовое сообщение отправлено':'Ошибка: '+r.error);break}
 }}catch(er){toast(er.message);a.disabled=false}});
function redrawLesson(){const d=document.querySelector('.drawer');const y=d.scrollTop;d.innerHTML=lessonEditor();d.scrollTop=y}
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.input==='lq'){leadF.q=el.value;document.getElementById('leadTable').innerHTML=leadTable(leadsFiltered())}
 if(el.dataset.ec){const k=el.dataset.ec;EC[k]=el.type==='checkbox'?el.checked:k==='outcomes'?el.value.split('\n').map(s=>s.trim()).filter(Boolean):el.type==='number'?Number(el.value):el.value;if(k==='cover')document.getElementById('covPrev').style.background=grad(el.value)}
 if(el.dataset.mod!==undefined)EC.modules[el.dataset.mod].t=el.value;
 if(el.dataset.les){const[m,l,k]=el.dataset.les.split('|');EC.modules[m].l[l][k]=el.type==='checkbox'?el.checked:el.value}
 if(el.dataset.b){const[i,k]=el.dataset.b.split('|');EL.lesson.blocks[i][k]=el.type==='checkbox'?el.checked:el.value}
 if(el.dataset.o){const[i,k,f]=el.dataset.o.split('|');const opts=EL.lesson.blocks[i].opts;if(f==='ok'){opts.forEach((o,n)=>o.ok=n==k);redrawLesson()}else opts[k][f]=el.value}
 if(el.dataset.plan){const[i,k]=el.dataset.plan.split('|');if(k==='best')D.plans.forEach((p,n)=>p.best=n==i);else D.plans[i][k]=Number(el.value)}});
document.addEventListener('change',async e=>{const el=e.target;
 if(el.dataset.change==='lftype'){leadF.type=el.value;rerenderMain()}
 if(el.dataset.range&&el.value){range[el.dataset.range]=el.value;range.preset='';D.an=null;rerenderMain();await load('analytics');render()}});
document.addEventListener('submit',async e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f).entries());
 try{
 if(k==='login'){const r=await api('/login',{method:'POST',body:fd});TK=r.token;sessionStorage.setItem(TOKEN_KEY,TK);await navigate()}
 if(k==='settings'){const body={...fd};f.querySelectorAll('input[type=checkbox]').forEach(c=>body[c.name]=c.checked);const r=await api('/settings',{method:'PUT',body});D.settings=r.settings;toast('Настройки сохранены');rerenderMain()}
 }catch(er){toast(er.message)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
navigate();
</script>
</body>
</html>
