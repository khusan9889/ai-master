<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>AI Master — демо платформы</title>

<style>
:root{
  --bg:#F6F3EC; --bg2:#EDE8DC; --card:#FFFFFF; --ink:#171A23; --muted:#5F5B52; --line:#E1DBCD;
  --orange:#FF7A1A; --orange-ink:#A84A0A; --orange-soft:#FFE9D8; --blue:#2457D6; --blue-soft:#E3EBFF;
  --green:#1F8F4E; --green-soft:#DDF3E5; --red:#C2410C; --red-soft:#FDE4D7;
  --dark:#13161F; --dark2:#1F2433; --dark3:#2A3043; --onDark:#F1EEE6;
  --radius:18px; --shadow:0 1px 2px rgba(20,20,30,.06),0 6px 24px rgba(20,20,30,.06);
}
[data-theme="dark"]{
  --bg:#0F1219; --bg2:#171B25; --card:#1A1F2C; --ink:#EEEBE3; --muted:#A9A496; --line:#2B3142;
  --orange-ink:#FF9A4D; --orange-soft:#3A2617; --blue:#7FA6FF; --blue-soft:#1C2742;
  --green:#5FCB7A; --green-soft:#16301F; --red:#FF8A5B; --red-soft:#3A1E14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:transparent}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(34px,5vw,58px);font-weight:800}
h2{font-size:clamp(26px,3.2vw,38px);font-weight:800}
h3{font-size:20px;font-weight:700}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;background:var(--orange);color:#13161F;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--dark);color:var(--onDark)}
[data-theme="dark"] .btn.dark{background:#2A3043}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:14px 24px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--muted)}
.pill.o{background:var(--orange-soft);color:var(--orange-ink)} .pill.g{background:var(--green-soft);color:var(--green)} .pill.b{background:var(--blue-soft);color:var(--blue)} .pill.r{background:var(--red-soft);color:var(--red)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink)}
section{padding:64px 0}
.demo-banner{background:var(--dark);color:var(--onDark);font-size:13px;text-align:center;padding:7px 12px}
.demo-banner b{color:#FF9A4D}
/* header */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Manrope;font-weight:800;font-size:21px}
.logo .ai{color:var(--orange)}
.logo>span{white-space:nowrap}
@media(max-width:560px){.nav{gap:8px}.logo{font-size:18px}.navright{gap:6px}.iconbtn{min-width:34px;height:34px;padding:0 7px}}
.navlinks{display:flex;gap:4px;margin-left:12px}
.navlinks a{text-decoration:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:15px}
.navlinks a:hover,.navlinks a.on{background:var(--bg2);color:var(--ink)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px}
.iconbtn{background:transparent;border:1.5px solid var(--line);border-radius:10px;height:38px;min-width:38px;padding:0 10px;color:var(--ink);font-weight:600;font-size:13px}
.burger{display:none}
@media(max-width:960px){.navlinks{display:none}.burger{display:inline-flex;align-items:center}.navlinks.open{display:flex;position:absolute;top:66px;left:0;right:0;flex-direction:column;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}}
@media(max-width:560px){.hide-sm{display:none!important}}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#13161F;display:grid;place-items:center;font-weight:800;font-family:Manrope}
/* hero */
.hero{padding:56px 0 40px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero h1 .o{color:var(--orange)}
.sandbox-mini{background:var(--dark);color:var(--onDark);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.sandbox-mini .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:#7FA6FF;text-transform:uppercase}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px}
.codebox{background:var(--dark3);border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word}
.okbar{background:#FF9A4D;color:#13161F;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;display:inline-block}
.steps .n{font-family:Manrope;font-weight:800;font-size:34px;color:var(--blue)}
/* course card */
.ccard{display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:transform .15s}
.ccard:hover{transform:translateY(-2px)}
.ccover{height:120px;border-radius:14px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:Manrope;font-weight:800;font-size:15px;position:relative;overflow:hidden}
.price{font-family:Manrope;font-weight:800;font-size:20px}
.price s{font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
/* filters */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}
/* lesson */
.lesson-layout{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:0;min-height:calc(100vh - 66px)}
@media(max-width:1180px){.lesson-layout{grid-template-columns:240px minmax(0,1fr)}.mentor{position:fixed;right:0;top:66px;bottom:0;width:min(380px,100%);transform:translateX(100%);transition:transform .2s;z-index:50}.mentor.open{transform:none}}
@media(max-width:820px){.lesson-layout{grid-template-columns:1fr}.toc{display:none}.toc.open{display:block;position:fixed;inset:66px 0 0 0;z-index:45}}
.toc{border-right:1px solid var(--line);padding:18px;background:var(--bg);overflow:auto}
.toc a{display:flex;gap:8px;align-items:center;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--muted)}
.toc a.on{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.toc a:hover{background:var(--bg2)}
.toc .mod{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.lesson-main{padding:0 20px 80px}
.lprog{position:sticky;top:66px;z-index:5;background:var(--bg);padding:12px 0 10px}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.bar.g>i{background:var(--green)}
.reader{max-width:720px;margin:0 auto}
.reader .block{margin:22px 0;position:relative}
.reader .txt p{margin:0 0 12px}
.reader .txt h2{font-size:30px;margin:6px 0 14px}
.reader .txt h3{margin:20px 0 8px}
.reader .txt ul{margin:0 0 12px;padding-left:22px}
.reader .txt li{margin:4px 0}
.reader table{border-collapse:collapse;width:100%;font-size:15px}
.reader th,.reader td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.reader th{background:var(--bg2)}
.callout{border-radius:14px;padding:14px 16px 14px 16px;border-left:5px solid}
.callout .h{font-weight:700;margin-bottom:4px}
.callout.tip{background:var(--blue-soft);border-color:var(--blue)}
.callout.important{background:var(--orange-soft);border-color:var(--orange)}
.callout.error{background:var(--red-soft);border-color:var(--red)}
.callout.example{background:var(--green-soft);border-color:var(--green)}
.code{background:var(--dark);color:var(--onDark);border-radius:14px;overflow:hidden}
.code .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--dark2);font-size:13px;color:#B9B4A8}
.code pre{margin:0;padding:14px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.55}
.k{color:#FF9A4D}.s{color:#9FE3A9}.c{color:#8A90A3}.f{color:#7FA6FF}
.formula{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;font-family:'Times New Roman',serif;font-size:24px}
.formula .cap{font-family:Inter;font-size:13px;color:var(--muted);margin-top:8px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.quiz .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:8px;color:var(--ink)}
.quiz .opt:hover{border-color:var(--orange)}
.quiz .opt.ok{border-color:var(--green);background:var(--green-soft)}
.quiz .opt.bad{border-color:var(--red);background:var(--red-soft)}
.quiz .why{font-size:14px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bg2)}
.sbx{background:var(--dark);color:var(--onDark);border-radius:18px;padding:18px}
.sbx textarea{background:var(--dark3);color:var(--onDark);border:1px solid #3A4157;font-family:'JetBrains Mono',monospace;font-size:14px;min-height:110px}
.sbx .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7FA6FF}
.sbx .out{background:var(--dark3);border-radius:12px;padding:12px;min-height:60px;white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13.5px;max-height:300px;overflow:auto}
.sbx .doc{background:#262C3D;border-radius:12px;padding:12px;font-size:14px;color:#D7D2C6}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#13161F}
.chk .ic.y{background:#5FCB7A}.chk .ic.n{background:#FF9A4D}
.blockbar{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;opacity:.75}
.blockbar button{background:transparent;border:0;color:var(--muted);font-size:12.5px;padding:2px 6px;border-radius:6px}
.blockbar button:hover{background:var(--bg2)}
.mentor{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;height:calc(100vh - 66px);position:sticky;top:66px}
.mentor .hd{padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:14px;font-size:14.5px;max-width:92%;white-space:pre-wrap}
.msg.u{background:var(--orange-soft);align-self:flex-end}
.msg.a{background:var(--bg2);align-self:flex-start}
.mentor form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.selbar{position:absolute;z-index:60;background:var(--dark);color:var(--onDark);border-radius:10px;padding:4px;display:flex;gap:2px;box-shadow:var(--shadow)}
.selbar button{background:transparent;border:0;color:var(--onDark);font-size:13px;padding:6px 9px;border-radius:7px}
.selbar button:hover{background:var(--dark3)}
.paywall{text-align:center;padding:36px 22px}
/* cabinet */
.cab{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;padding:28px 0 60px}
@media(max-width:820px){.cab{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;height:fit-content;position:sticky;top:84px}
@media(max-width:820px){.side{position:static;display:flex;overflow:auto;gap:4px}.side a{white-space:nowrap}}
.side a{display:block;text-decoration:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:15px}
.side a.on{background:var(--orange-soft);color:var(--orange-ink);font-weight:600}
.side a:hover{background:var(--bg2)}
.stat .v{font-family:Manrope;font-weight:800;font-size:32px}
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bg2)}
.heat i.l1{background:#FFD3B0}.heat i.l2{background:#FFA866}.heat i.l3{background:var(--orange)}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:10px;border-bottom:1px solid var(--line)}
table.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* certificate */
.cert{background:linear-gradient(135deg,#FBF8F1,#F3ECDD);color:#171A23;border-radius:18px;padding:34px;border:2px solid #E3D6BA;position:relative}
.cert .seal{position:absolute;right:28px;top:28px}
/* pay demo */
.paydemo{max-width:560px;margin:40px auto}
.log{background:var(--dark);color:#B9F0C4;border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;min-height:120px;white-space:pre-wrap}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:90;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:var(--onDark);padding:12px 18px;border-radius:12px;z-index:100;font-size:14.5px;box-shadow:var(--shadow);max-width:90vw}
footer{border-top:1px solid var(--line);padding:40px 0;margin-top:40px}
footer a{text-decoration:none;color:var(--muted);font-size:14px;display:block;padding:3px 0}
footer a:hover{color:var(--ink)}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.faq summary{font-weight:600;cursor:pointer}
.plan.best{border:2px solid var(--orange)}
.opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.choice.on{border-color:var(--orange);background:var(--orange-soft)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.ai-badge{font-size:12px;padding:3px 8px;border-radius:999px;background:#2A3043;color:#9FE3A9}
.ai-badge.off{color:#FFB37A}
</style>
</head>

/* ---- lesson player ---- */
let LP={course:null,lesson:null,chat:[]};
function pLesson(lid){
 const f=findLesson(lid);if(!f)return pNotFound();const {c,l}=f;
 const ls=allLessons(c);const idx=ls.findIndex(x=>x.id===lid);
 const data=LESSONS[lid]||genericLesson(l,c);
 if(LP.lesson!==lid){LP={course:c.id,lesson:lid,chat:[]}}
 const acc=hasAccess(c,l);
 const prevDone=!c.seq||idx===0||S.done[ls[idx-1].id]||l.free;
 const req=data.blocks.filter(b=>b.req);
 const reqDone=req.filter(b=>blockDone(b)).length;
 const pct=req.length?Math.round(reqDone/req.length*100):100;
 S.lessonPos[c.id]=lid;save();
 return `<div class="lesson-layout">
 <aside class="toc" id="toc"><a href="#course-${c.id}" style="font-weight:700;color:var(--ink)">← ${esc(c.title)}</a>
  <div class="small muted" style="padding:4px 10px">Прогресс курса: ${courseProgress(c)}%</div>
  ${c.modules.map(m=>`<div class="mod">${esc(m.t)}</div>${m.l.map(x=>`<a href="#lesson-${x.id}" class="${x.id===lid?'on':''}"><span class="dot ${S.done[x.id]?'done':''}">${S.done[x.id]?'✓':''}</span><span>${esc(x.t)}</span>${!hasAccess(c,x)?' 🔒':''}</a>`).join('')}`).join('')}
 </aside>
 <div class="lesson-main">
  <div class="lprog"><div class="reader">
   <div class="row" style="justify-content:space-between;margin-bottom:8px;flex-wrap:nowrap">
    <button class="iconbtn" data-act="toggleToc" style="display:none" id="tocBtn">☰</button>
    <span class="small muted">Урок ${idx+1} из ${ls.length} · ~${data.min} мин</span>
    <span class="row" style="gap:6px;flex-wrap:nowrap"><button class="iconbtn" data-act="font" data-arg="-1" aria-label="Меньше">A−</button><button class="iconbtn" data-act="font" data-arg="1" aria-label="Больше">A+</button><button class="iconbtn" data-act="toggleMentor" id="mentorBtn">✦ Наставник</button></span>
   </div>
   <div class="bar"><i style="width:${pct}%"></i></div></div></div>
  <div class="reader" id="reader" style="font-size:${S.font||17}px">
   ${!acc?paywall(c):!prevDone?`<div class="card paywall col" style="align-items:center"><h3>Урок откроется после предыдущего</h3><p class="muted">В этом курсе включено последовательное прохождение.</p><a class="btn" href="#lesson-${ls[idx-1].id}">К предыдущему уроку</a></div>`:
    data.blocks.map((b,i)=>renderBlock(b,i,lid)).join('')+`
    <div class="card row" style="justify-content:space-between;margin-top:30px">
     <div class="col" style="gap:4px"><b>${S.done[lid]?'Урок пройден ✓':reqDone<req.length?`Выполнено обязательных блоков: ${reqDone} из ${req.length}`:'Все задания выполнены'}</b><span class="small muted">Был ли урок полезен?</span>
      <span class="row" style="gap:6px"><button class="btn sm ghost" data-act="rate" data-arg="up">👍 Полезно</button><button class="btn sm ghost" data-act="rate" data-arg="down">🤔 Непонятно</button></span></div>
     <button class="btn" data-act="completeLesson" data-arg="${lid}" ${reqDone<req.length||S.done[lid]?'disabled':''}>${S.done[lid]?'Пройдено':t('complete')} · +50 XP</button>
    </div>`}
   <div class="row" style="justify-content:space-between;margin-top:18px">
    ${idx>0?`<a class="btn ghost" href="#lesson-${ls[idx-1].id}">← ${t('prev')}</a>`:'<span></span>'}
    ${idx<ls.length-1?`<a class="btn ghost" href="#lesson-${ls[idx+1].id}">${t('next')} →</a>`:`<a class="btn ghost" href="#course-${c.id}">К курсу →</a>`}
   </div>
  </div>
 </div>
 ${mentorPanel(c,l)}
 </div>`}
function paywall(c){return `<div class="card paywall col" style="align-items:center;gap:14px"><div style="font-size:40px">🔒</div><h3>Урок доступен после покупки</h3><p class="muted">Купите курс или оформите подписку на весь каталог.</p><div class="row" style="justify-content:center"><a class="btn" href="#checkout-course-${c.id}">${t('buy')} · ${fmt(c.price)}</a><a class="btn ghost" href="#checkout-sub3">Подписка</a></div></div>`}
function blockDone(b){if(b.t==='quiz')return S.quiz[b.id]&&S.quiz[b.id].ok;if(b.t==='sandbox')return S.quiz[b.id]&&S.quiz[b.id].score>=7;return true}
function bb(i){return `<div class="blockbar"><button data-act="report" data-arg="${i}">⚑ Сообщить об ошибке</button></div>`}
function renderBlock(b,i,lid){
 if(b.t==='text')return `<div class="block txt" data-sel>${b.html}${bb(i)}</div>`;
 if(b.t==='callout')return `<div class="block"><div class="callout ${b.kind}" data-sel><div class="h">${b.h}</div><div>${b.html}</div></div></div>`;

function fakeModel(prompt,contract){
 const p=prompt.toLowerCase();
 const amount=Number((contract.match(/(?:составляет|услуг —)\s*([\d\s]+)\s*\(/)||[])[1]?.replace(/\s/g,'')||0);
 const dm=contract.match(/(\d{1,2})\s+(декабря|марта)\s+(\d{4})/);const mon={декабря:'12',марта:'03'};
 const iso=dm?`${dm[3]}-${mon[dm[2]]}-${dm[1].padStart(2,'0')}`:'';const human=dm?`${dm[1]} ${dm[2]} ${dm[3]}`:'';
 const pen=(contract.match(/(\d+,\d+)%/)||[])[1]||'';
 if(!/json/.test(p)){return `В договоре указана сумма ${amount.toLocaleString('ru-RU')} сум, срок — ${human} года, пеня — ${pen}% за каждый день просрочки.`}
 const keys=/amount|deadline|penalty/.test(p)?['amount','deadline','penalty']:['сумма','срок','штраф'];
 const numPen=/числ|number|0\.1|процент/.test(p);const isoD=/гггг|yyyy|iso|\d{4}-\d{2}/.test(p);const onlyJson=/только|only|без поясн|без текста/.test(p);
 const obj={};obj[keys[0]]=/числ|number|сум/.test(p)?amount:amount.toLocaleString('ru-RU')+' сум';obj[keys[1]]=isoD?iso:human;obj[keys[2]]=numPen?Number(pen.replace(',','.')):pen+'% в день';
 const js=JSON.stringify(obj,null,2);return onlyJson?js:'Вот данные из договора:\n'+js+'\nЕсли нужно, могу добавить другие поля.'}
async function runModel(prompt,contract){
 const real=await askAI(`${prompt}\n\n---\nТекст договора:\n${contract}`,{cache:true});
 if(real!=null)return {text:real,real:true};
 await new Promise(r=>setTimeout(r,600));return {text:fakeModel(prompt,contract),real:false}}
function extractJSON(s){const m=s.match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0])}catch(e){return null}}
function checkOne(text,exp){const o=extractJSON(text);const r={json:!!o,amount:false,deadline:false,penalty:false,onlyJson:false};if(!o)return r;
 r.onlyJson=text.trim().startsWith('{')||/^```(json)?\s*\{/.test(text.trim());
 const get=k=>o[k];r.amount=Number(get('amount'))===exp.amount&&typeof get('amount')==='number';r.deadline=get('deadline')===exp.deadline;
 const pv=get('penalty');r.penalty=typeof pv==='number'&&(Math.abs(pv-exp.penalty)<1e-9||Math.abs(pv-exp.penalty/100)<1e-9);return r}

 return `<svg width="84" height="84" viewBox="-1 -1 23 23" style="background:#fff;border-radius:6px" aria-label="QR-код (демо)"><g fill="#171A23">${s}</g></svg>`}

async function simulatePay(oid){const o=S.orders.find(x=>x.id===oid);if(!o||o.status!=='pending')return;
 const steps=o.method==='Click'?[`POST /api/pay/click/prepare  click_trans_id=${Math.floor(Math.random()*9e6)} merchant_trans_id=${o.id} amount=${o.amount}`,'  ✓ sign_string (MD5) верна · заказ найден · сумма совпадает → error=0','POST /api/pay/click/complete  action=1','  ✓ подпись верна · статус заказа: оплачен','  ✓ доступ открыт · фискальный чек сформирован (ИКПУ '+o.ikpu+')']
  :[`POST /api/pay/payme  CheckPerformTransaction  account.order_id=${o.id} amount=${o.amount*100} тийин`,'  ✓ Basic Auth по ключу кассы · заказ можно оплатить','POST /api/pay/payme  CreateTransaction','  ✓ транзакция создана, state=1','POST /api/pay/payme  PerformTransaction','  ✓ state=2 · заказ оплачен · доступ открыт','  ✓ фискальный чек (ИКПУ '+o.ikpu+')'];
 o.log=[];const el=document.getElementById('paylog');
 for(const s of steps){o.log.push(s);if(el)el.textContent=o.log.join('\n');await new Promise(r=>setTimeout(r,450))}
 o.status='paid';o.paid=new Date().toISOString();
 if(o.type==='course'&&!S.owned.includes(o.ref))S.owned.push(o.ref);
 if(o.type==='sub'){const until=new Date();until.setMonth(until.getMonth()+o.months);S.sub={status:'active',months:o.months,until:until.toISOString(),auto:true,method:o.method}}
 save();toast('Оплата прошла — доступ открыт');render();showReceipt(o.id)}

  case 'resetOk':S=DEFAULT();save();closeModal();go('home');break;
  case 'coMethod':co.method=arg;render();break;
  case 'createOrder':{const it=coItem(arg);const {total}=calc(it);const o={id:'ORD-'+Math.floor(Math.random()*9e4+1e4),key:arg,title:it.title,amount:total,method:co.method,type:it.type,ref:it.id,months:it.months,ikpu:it.ikpu,status:'pending',created:new Date().toISOString(),log:[`Заказ создан · статус «ожидает оплаты» · переход на страницу ${co.method}`]};
    if(co.promo){const pr=S.promos.find(p=>p.code===co.promo.code);if(pr)pr.used++}S.orders.push(o);co.promo=null;save();go('pay-'+o.id);break}
  case 'payOk':a.disabled=true;simulatePay(arg);break;
  case 'payCancel':{const o=S.orders.find(x=>x.id===arg);o.status='cancelled';o.log=(o.log||[]).concat(['Пользователь отменил оплату · статус «отменён»']);save();render();break}
  case 'assignOpen':modal(`<h3>Назначить курс</h3><div class="col" style="margin-top:12px"><select id="asEmp">${S.employees.map((e,i)=>`<option value="${i}">${esc(e.n)}</option>`).join('')}<option value="all">Весь отдел аналитики</option></select><select id="asCourse">${COURSES.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select><input id="asDl" type="date"><div class="row"><button class="btn" data-act="assignOk">Назначить</button><button class="btn ghost" data-act="closeModal">Отмена</button></div></div>`);break;
  case 'assignOk':{const ei=document.getElementById('asEmp').value,cid=document.getElementById('asCourse').value,dl=document.getElementById('asDl').value;const tg=ei==='all'?S.employees.filter(e=>e.dep==='Аналитика'):[S.employees[ei]];tg.forEach(e=>{e.course=cid;e.p=0;e.score=null;e.deadline=dl?new Date(dl).toLocaleDateString('ru-RU'):''});save();closeModal();render();toast('Курс назначен, сотрудники получат уведомление');break}
  case 'compTab':compTab=arg;render();break;
  case 'exportCsv':{const csv='Сотрудник;Отдел;Курс;Прогресс;Балл\n'+S.employees.map(e=>[e.n,e.dep,course(e.course)?.title,e.p+'%',e.score??''].join(';')).join('\n');try{await navigator.clipboard.writeText(csv);toast('Отчёт скопирован — вставьте в Excel')}catch(_){toast('Не удалось скопировать')}break}
  case 'admTab':admTab=arg;render();break;
  case 'refund':{const o=S.orders.find(x=>x.id===arg);o.status='refunded';if(o.type==='course')S.owned=S.owned.filter(x=>x!==o.ref);if(o.type==='sub'&&S.sub)S.sub.status='refunded';save();render();toast('Возврат оформлен, доступ отозван');break}
  case 'aiDraft':{const out=document.getElementById('aiDraftOut');out.textContent='Генерирую черновик квиза…';const txt='Хороший промпт отвечает на четыре вопроса: кто отвечает, что сделать, в каком виде вернуть результат и на что опираться.';
    const r=await askAI(`Составь один вопрос-квиз с 3 вариантами ответа (один верный, отметь его) по тексту урока. Кратко, по-русски.\n\nТекст: ${txt}`,{cache:true});
    out.innerHTML=`<div class="callout tip"><div class="h">Черновик от ИИ — требует проверки редактором</div><div style="white-space:pre-wrap">${esc(r||'Вопрос: Что из этого НЕ входит в анатомию хорошего промпта?\nA) Роль  B) Формат ответа  C) Цвет шрифта ✓\n(демо-режим)')}</div></div>`;break}
 }
});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.change;if(!k)return;
 if(k==='lang'){S.lang=el.value;document.documentElement.lang=S.lang;save();render()}
 if(k==='catTopic'){catF.topic=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}
 if(k==='catLevel'){catF.level=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}
 if(k==='catPrice'){catF.price=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}
 if(k==='catSort'){catF.sort=el.value;document.getElementById('catGrid').innerHTML=catalogItems()}
 if(k==='lb'){S.lbOptIn=el.checked;save();render()}
 if(k==='price'){const c=course(el.dataset.id);const v=Math.max(0,Number(el.value)||0);c.price=v;S.prices[c.id]=v;save();toast('Цена обновлена · запись в журнале действий')}
});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(k==='catq'){catF.q=e.target.value;document.getElementById('catGrid').innerHTML=catalogItems()}if(k==='noteq'){noteQ=e.target.value;document.getElementById('notesList').innerHTML=notesList()}});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset.submit;if(!k)return;e.preventDefault();
 if(k==='phone'){const ph=document.getElementById('phone').value.trim();if(ph.replace(/\D/g,'').length<12){toast('Введите номер полностью: +998 XX XXX XX XX');return}if(!document.getElementById('agree').checked){toast('Нужно принять оферту и согласие');return}auth={step:'code',phone:ph};render();toast('SMS-код отправлен (демо: 1234)')}
 if(k==='code'){const c=document.getElementById('code').value.trim();if(c!=='1234'){toast('Неверный код. Демо-код: 1234');return}auth.step='phone';doLogin('Студент','phone')}
 if(k==='mentor'){const i=document.getElementById('mentorIn');const q=i.value.trim();if(!q)return;i.value='';mentorAsk(q)}
 if(k==='promo'){const code=document.getElementById('promoIn').value.trim().toUpperCase();const p=S.promos.find(x=>x.code===code&&x.active&&x.used<x.limit);if(p){co.promo=p;toast('Промокод применён');render()}else toast('Промокод не найден или истёк')}
 if(k==='profile'){S.user.name=document.getElementById('pfName').value.trim()||S.user.name;save();toast('Сохранено');render()}
 if(k==='lead'){f.reset();toast('Спасибо! В рабочей версии менеджер свяжется с вами. В демо заявка не отправлена.')}
 if(k==='invite'){const n=document.getElementById('invName').value.trim();if(!n)return;S.employees.push({n,dep:'Новые',course:'ai-basics',p:0,score:null});save();toast('Сотрудник добавлен, приглашение отправлено (демо)');render()}
 if(k==='newPromo'){const code=document.getElementById('npCode').value.trim().toUpperCase();const val=Number(document.getElementById('npVal').value);if(!code||!val){toast('Укажите код и значение');return}S.promos.push({code,type:document.getElementById('npType').value,val,limit:Number(document.getElementById('npLim').value)||100,used:0,active:true});save();render();toast('Промокод создан')}
 if(k==='verify'){const no=document.getElementById('vNo').value.trim().toUpperCase();const c=[DEMO_CERT,...S.certs].find(x=>x.no===no);vRes={no,ok:!!c,c};render()}
});

/* ---- selection toolbar in lessons ---- */
let selText='';
document.addEventListener('mouseup',e=>{setTimeout(()=>{const old=document.querySelector('.selbar');if(e.target.closest('.selbar'))return;old&&old.remove();
 const s=window.getSelection();const txt=s?String(s).trim():'';if(!txt||txt.length<3)return;const anchor=s.anchorNode&&s.anchorNode.parentElement;if(!anchor||!anchor.closest('[data-sel]'))return;
 selText=txt.slice(0,400);const rect=s.getRangeAt(0).getBoundingClientRect();const bar=document.createElement('div');bar.className='selbar';
 bar.style.left=(rect.left+window.scrollX)+'px';bar.style.top=(rect.top+window.scrollY-44)+'px';
 bar.innerHTML=`<button data-sa="simple">Объясни проще</button><button data-sa="ex">Дай пример</button><button data-sa="tr">Переведи</button><button data-sa="note">Заметка</button>`;document.body.appendChild(bar)},10)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-sa]');if(!b)return;const k=b.dataset.sa;document.querySelector('.selbar')?.remove();
 if(k==='note'){const lid=location.hash.slice(8);const f=findLesson(lid);S.notes.unshift({text:selText,note:'',lid,lesson:f?f.l.t:'',date:new Date().toLocaleDateString('ru-RU')});save();toast('Заметка сохранена · Кабинет → Заметки');return}
 document.getElementById('mentor')?.classList.add('open');mentorAsk({simple:'Объясни проще',ex:'Дай пример',tr:'Переведи на узбекский'}[k]+`: «${selText}»`)});

render();lastRoute=location.hash.slice(1);
</script>
